<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RS 3D Custom Studio</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --orange:#ff6500;
    --orange2:#ff9d4d;
    --white:#ffffff;
    --silver:#e9edf2;
    --dark:#111315;
    --dark2:#1b1e21;
    --glass:rgba(255,255,255,.10);
    --shadow:0 20px 60px rgba(0,0,0,.35);
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:
        radial-gradient(circle at 20% 10%,rgba(255,101,0,.18),transparent 30%),
        radial-gradient(circle at 80% 30%,rgba(255,255,255,.08),transparent 25%),
        linear-gradient(135deg,#080909,#181a1c 45%,#090a0b);
    color:white;
    min-height:100vh;
    overflow-x:hidden;
}

/* ================= HEADER ================= */

header{
    position:sticky;
    top:0;
    z-index:1000;
    background:rgba(10,11,12,.82);
    backdrop-filter:blur(20px);
    border-bottom:1px solid rgba(255,255,255,.12);
}

.navbar{
    max-width:1400px;
    margin:auto;
    padding:15px 25px;
    display:flex;
    align-items:center;
    gap:20px;
}

.logo{
    display:flex;
    align-items:center;
    gap:12px;
    min-width:230px;
}

.logo-box{
    width:48px;
    height:48px;
    border-radius:14px;

    background:
        linear-gradient(145deg,#fff,#d7dbe0 40%,#ff6500 43%,#ff9a45);

    color:#111;
    display:flex;
    align-items:center;
    justify-content:center;

    font-size:20px;
    font-weight:900;

    box-shadow:
        inset 3px 3px 8px rgba(255,255,255,.8),
        inset -4px -4px 8px rgba(0,0,0,.25),
        0 0 25px rgba(255,101,0,.35);
}

.logo-text strong{
    color:white;
    font-size:18px;
}

.logo-text span{
    display:block;
    color:#ff9147;
    font-size:12px;
    margin-top:3px;
}

.search{
    flex:1;
}

.search input{
    width:100%;
    padding:13px 20px;
    border-radius:30px;
    border:1px solid rgba(255,255,255,.2);
    background:linear-gradient(145deg,#242729,#0e0f10);
    color:white;
    outline:none;
    box-shadow:inset 0 2px 8px rgba(0,0,0,.5);
}

.search input:focus{
    border-color:var(--orange);
    box-shadow:0 0 20px rgba(255,101,0,.2);
}

.nav-actions{
    display:flex;
    gap:8px;
}

.nav-btn{
    border:1px solid rgba(255,255,255,.18);
    background:linear-gradient(145deg,#303337,#111315);
    color:white;
    padding:11px 16px;
    border-radius:12px;
    cursor:pointer;
    font-weight:bold;
}

.nav-btn:hover{
    transform:translateY(-2px);
    border-color:#ff6500;
}

/* ================= HERO ================= */

.hero{
    min-height:650px;
    max-width:1450px;
    margin:auto;
    padding:80px 35px;
    display:grid;
    grid-template-columns:1fr 1fr;
    align-items:center;
    gap:50px;
    perspective:1200px;
}

.hero-content{
    transform-style:preserve-3d;
}

.badge{
    display:inline-block;
    padding:9px 18px;
    border-radius:30px;
    color:#fff;
    background:linear-gradient(145deg,#ff9b4a,#e84d00);
    box-shadow:
        inset 2px 2px 5px rgba(255,255,255,.5),
        0 8px 25px rgba(255,101,0,.3);
    font-size:13px;
    font-weight:bold;
}

.hero h1{
    margin-top:22px;
    font-size:clamp(42px,6vw,80px);
    line-height:.95;
    letter-spacing:-3px;
}

.hero h1 span{
    color:#ff7620;
    text-shadow:0 0 25px rgba(255,101,0,.3);
}

.hero p{
    margin-top:25px;
    max-width:580px;
    color:#c8cdd2;
    line-height:1.7;
    font-size:17px;
}

.hero-buttons{
    display:flex;
    gap:15px;
    margin-top:32px;
    flex-wrap:wrap;
}

.btn{
    border:0;
    padding:15px 25px;
    border-radius:14px;
    cursor:pointer;
    font-weight:bold;
    font-size:15px;
    transition:.25s;
}

.btn-orange{
    color:white;
    background:linear-gradient(145deg,#ff9d4d,#f04d00);
    box-shadow:
        inset 2px 2px 5px rgba(255,255,255,.4),
        0 12px 30px rgba(255,101,0,.25);
}

.btn-white{
    color:#111;
    background:linear-gradient(145deg,#fff,#cfd4d9);
    box-shadow:
        inset 2px 2px 5px white,
        0 10px 25px rgba(0,0,0,.3);
}

.btn:hover{
    transform:translateY(-4px) scale(1.02);
}

/* ================= 3D PRINTER ================= */

.hero-3d{
    height:500px;
    position:relative;
    display:flex;
    justify-content:center;
    align-items:center;
    perspective:1200px;
}

.printer{
    width:390px;
    height:340px;
    position:relative;
    transform-style:preserve-3d;
    transform:rotateX(-8deg) rotateY(-18deg);
    animation:printerFloat 5s ease-in-out infinite;
}

@keyframes printerFloat{
    0%,100%{
        transform:rotateX(-8deg) rotateY(-18deg) translateY(0);
    }
    50%{
        transform:rotateX(-5deg) rotateY(-13deg) translateY(-12px);
    }
}

.printer-frame{
    position:absolute;
    left:30px;
    top:20px;
    width:330px;
    height:280px;
    border:14px solid #dfe3e7;
    border-radius:20px;
    background:rgba(255,255,255,.04);

    box-shadow:
        inset 0 0 20px rgba(0,0,0,.5),
        0 25px 45px rgba(0,0,0,.45);
}

.printer-frame:before{
    content:"";
    position:absolute;
    width:100%;
    height:14px;
    left:-14px;
    top:-14px;

    background:linear-gradient(90deg,#fff,#bfc5cb,#fff);
    border-radius:15px;
}

.orange-column{
    position:absolute;
    width:25px;
    height:300px;
    background:linear-gradient(90deg,#b83d00,#ff8a35,#d84c00);
    top:8px;
    box-shadow:0 0 20px rgba(255,101,0,.25);
}

.column-left{
    left:20px;
}

.column-right{
    right:20px;
}

.printer-bed{
    position:absolute;
    left:25px;
    bottom:25px;
    width:340px;
    height:35px;

    background:
        linear-gradient(145deg,#ffffff,#aeb5bc);

    transform:rotateX(55deg);
    transform-origin:center;

    border-radius:8px;

    box-shadow:
        0 15px 25px rgba(0,0,0,.5),
        inset 2px 2px 5px white;
}

.print-object{
    position:absolute;
    left:145px;
    bottom:72px;
    width:100px;
    height:110px;

    background:
        linear-gradient(90deg,#d7dce0,#fff,#bfc5ca);

    clip-path:polygon(
        10% 100%,
        0 90%,
        10% 78%,
        0 65%,
        12% 52%,
        4% 38%,
        20% 25%,
        18% 0,
        82% 0,
        80% 25%,
        96% 38%,
        88% 52%,
        100% 65%,
        90% 78%,
        100% 90%,
        90% 100%
    );

    box-shadow:0 15px 25px rgba(0,0,0,.3);
}

.nozzle{
    position:absolute;
    top:68px;
    left:170px;
    width:48px;
    height:55px;

    background:linear-gradient(145deg,#fff,#b7bdc3);
    border-radius:8px;

    box-shadow:0 8px 15px rgba(0,0,0,.4);
}

.nozzle-tip{
    position:absolute;
    bottom:-15px;
    left:17px;
    width:14px;
    height:20px;

    background:linear-gradient(90deg,#ff9a4b,#d84800);
    clip-path:polygon(20% 0,80% 0,100% 100%,0 100%);
}

.print-line{
    position:absolute;
    top:125px;
    left:70px;
    width:210px;
    height:5px;
    background:#ff6500;
    box-shadow:0 0 15px #ff6500;
    animation:printLine 2s linear infinite;
}

@keyframes printLine{
    0%{width:20px}
    50%{width:210px}
    100%{width:20px}
}

/* ================= SECTION ================= */

.section{
    max-width:1400px;
    margin:auto;
    padding:70px 25px;
}

.section-title{
    text-align:center;
    margin-bottom:45px;
}

.section-title h2{
    font-size:40px;
}

.section-title span{
    color:#ff7220;
}

.section-title p{
    color:#aeb4ba;
    margin-top:10px;
}

/* ================= CATEGORY ================= */

.categories{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:30px;
}

.category-card{
    min-height:280px;
    padding:35px;
    border-radius:28px;
    position:relative;
    overflow:hidden;

    background:
        linear-gradient(145deg,
        rgba(255,255,255,.18),
        rgba(255,255,255,.04) 45%,
        rgba(255,101,0,.10));

    border:1px solid rgba(255,255,255,.2);

    box-shadow:
        inset 2px 2px 10px rgba(255,255,255,.15),
        0 25px 60px rgba(0,0,0,.35);

    transform-style:preserve-3d;
    transition:.4s;
}

.category-card:hover{
    transform:rotateX(4deg) rotateY(-5deg) translateY(-8px);
    border-color:#ff6500;
}

.category-icon{
    font-size:60px;
    transform:translateZ(35px);
}

.category-card h3{
    margin-top:20px;
    font-size:28px;
    transform:translateZ(25px);
}

.category-card p{
    margin-top:10px;
    color:#bfc4c8;
    max-width:500px;
    line-height:1.6;
}

.category-card button{
    margin-top:22px;
}

/* ================= PRODUCTS ================= */

.products{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:22px;
}

.product-card{
    position:relative;
    overflow:hidden;

    background:
        linear-gradient(145deg,#292c2f,#111315);

    border:1px solid rgba(255,255,255,.12);
    border-radius:22px;

    box-shadow:
        0 20px 40px rgba(0,0,0,.35),
        inset 1px 1px 2px rgba(255,255,255,.1);

    transition:.35s;
    transform-style:preserve-3d;
}

.product-card:hover{
    transform:translateY(-10px) rotateX(3deg) rotateY(-3deg);
    border-color:#ff6500;
}

.product-image{
    height:220px;
    position:relative;
    overflow:hidden;
    background:#202326;
}

.product-image img{
    width:100%;
    height:100%;
    object-fit:cover;
    transition:.5s;
}

.product-card:hover img{
    transform:scale(1.08);
}

.product-info{
    padding:18px;
}

.product-info h3{
    font-size:17px;
}

.product-info p{
    margin-top:8px;
    color:#aeb5ba;
    font-size:13px;
    min-height:38px;
}

.price{
    margin-top:15px;
    font-size:22px;
    color:#ff7625;
    font-weight:bold;
}

.product-actions{
    display:flex;
    gap:8px;
    margin-top:15px;
}

.small-btn{
    flex:1;
    padding:10px;
    border-radius:10px;
    cursor:pointer;
    border:1px solid rgba(255,255,255,.15);
    background:#24272a;
    color:white;
}

.small-btn.orange{
    background:linear-gradient(145deg,#ff9145,#e84b00);
}

/* ================= PRODUCT DETAIL ================= */

.detail{
    max-width:1200px;
    margin:60px auto;
    padding:25px;
}

.detail-box{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:40px;

    background:linear-gradient(145deg,#25282b,#111315);
    padding:30px;
    border-radius:30px;

    border:1px solid rgba(255,255,255,.15);
    box-shadow:var(--shadow);
}

.gallery-main{
    width:100%;
    height:450px;
    object-fit:cover;
    border-radius:20px;
    background:#222;
}

.thumbs{
    display:flex;
    gap:10px;
    margin-top:12px;
    overflow-x:auto;
}

.thumbs img{
    width:80px;
    height:70px;
    object-fit:cover;
    border-radius:10px;
    cursor:pointer;
    border:2px solid transparent;
}

.thumbs img:hover{
    border-color:#ff6500;
}

.detail h1{
    font-size:40px;
}

.detail-description{
    margin-top:15px;
    color:#b9bec3;
    line-height:1.7;
}

.quantity-box{
    margin-top:25px;
}

.quantity-box label{
    display:block;
    margin-bottom:8px;
}

.quantity-box input{
    width:100px;
    padding:13px;
    border-radius:10px;
    background:#080909;
    color:white;
    border:1px solid #555;
}

.detail-price{
    margin-top:25px;
    color:#ff7625;
    font-size:32px;
    font-weight:bold;
}

/* ================= CART ================= */

.cart-container,
.checkout{
    max-width:1000px;
    margin:60px auto;
    padding:25px;
}

.cart-item{
    display:flex;
    align-items:center;
    gap:20px;
    padding:20px;
    margin-bottom:15px;

    border-radius:18px;
    background:linear-gradient(145deg,#25282a,#111315);
    border:1px solid rgba(255,255,255,.12);
}

.cart-item img{
    width:90px;
    height:75px;
    object-fit:cover;
    border-radius:10px;
}

.cart-info{
    flex:1;
}

.cart-info h3{
    margin-bottom:6px;
}

.cart-info p{
    color:#aeb4b9;
}

.remove{
    border:0;
    background:#ef3d25;
    color:white;
    padding:10px 14px;
    border-radius:9px;
    cursor:pointer;
}

.cart-total{
    text-align:right;
    font-size:28px;
    color:#ff7625;
    margin-top:25px;
}

/* ================= FORM ================= */

.form-group{
    margin-bottom:18px;
}

.form-group label{
    display:block;
    margin-bottom:7px;
}

.form-group input,
.form-group textarea{
    width:100%;
    padding:14px;
    border-radius:12px;
    border:1px solid rgba(255,255,255,.15);
    background:#101214;
    color:white;
    outline:none;
}

.form-group textarea{
    min-height:100px;
    resize:vertical;
}

/* ================= FOOTER ================= */

footer{
    margin-top:80px;
    padding:40px 25px;
    text-align:center;

    background:linear-gradient(145deg,#191b1d,#080909);
    border-top:1px solid rgba(255,255,255,.12);
}

footer strong{
    color:#ff7625;
}

footer p{
    margin-top:8px;
    color:#8f969b;
}

/* ================= WHATSAPP ================= */

.whatsapp{
    position:fixed;
    right:22px;
    bottom:22px;
    z-index:999;

    width:62px;
    height:62px;

    border-radius:50%;
    background:#25D366;

    display:flex;
    align-items:center;
    justify-content:center;

    color:white;
    font-size:28px;
    text-decoration:none;

    box-shadow:0 10px 30px rgba(37,211,102,.35);
}

/* ================= EMPTY ================= */

.empty{
    text-align:center;
    padding:80px 20px;
    color:#aaa;
}

/* ================= RESPONSIVE ================= */

@media(max-width:1000px){

    .products{
        grid-template-columns:repeat(2,1fr);
    }

    .hero{
        grid-template-columns:1fr;
        text-align:center;
    }

    .hero p{
        margin-left:auto;
        margin-right:auto;
    }

    .hero-buttons{
        justify-content:center;
    }

    .detail-box{
        grid-template-columns:1fr;
    }

}

@media(max-width:700px){

    .navbar{
        flex-wrap:wrap;
    }

    .logo{
        min-width:auto;
    }

    .search{
        order:3;
        flex-basis:100%;
    }

    .nav-actions{
        margin-left:auto;
    }

    .categories{
        grid-template-columns:1fr;
    }

    .products{
        grid-template-columns:1fr;
    }

    .hero{
        padding-top:50px;
    }

    .hero-3d{
        height:400px;
        transform:scale(.75);
    }

    .hero h1{
        font-size:48px;
    }

    .detail h1{
        font-size:30px;
    }

    .gallery-main{
        height:300px;
    }

}
</style>
</head>

/* =========================================================
   CART
========================================================= */

let cart=JSON.parse(localStorage.getItem("rs3d_cart")||"[]");


function saveCart(){

    localStorage.setItem(
        "rs3d_cart",
        JSON.stringify(cart)
    );

    updateCartCount();
}


function updateCartCount(){

    const count=cart.reduce(
        (sum,item)=>sum+item.quantity,
        0
    );

    const el=document.getElementById("cartCount");

    if(el){
        el.textContent=count;
    }
}


/* =========================================================
   HISTORY / NAVIGATION
========================================================= */

function navigate(state){

    let hash="#home";

    if(state.page==="category"){
        hash="#"+state.type;
    }

    if(state.page==="product"){
        hash="#product-"+state.id;
    }

    if(state.page==="cart"){
        hash="#cart";
    }

    if(state.page==="checkout"){
        hash="#checkout";
    }

    history.pushState(
        state,
        "",
        hash
    );

    render(state);
}


function goHome(){
    navigate({page:"home"});
}


function goCategory(type){
    navigate({
        page:"category",
        type:type
    });
}


function goProduct(id){
    navigate({
        page:"product",
        id:Number(id)
    });
}


function goCart(){
    navigate({page:"cart"});
}


function goCheckout(){
    navigate({page:"checkout"});
}


window.addEventListener(
    "popstate",
    function(event){

        render(
            event.state ||
            {page:"home"}
        );

    }
);

function categorySearch(type,value){

    const q=value
        .trim()
        .toLowerCase();

    const products=PRODUCTS.filter(p=>{

        return p.type===type &&
        (
            p.name.toLowerCase().includes(q) ||
            p.description.toLowerCase().includes(q)
        );

    });

    const container=
        document.getElementById(
            "categoryProducts"
        );

    if(container){

        container.innerHTML=
            products.length
            ? products.map(productCard).join("")
            : `
                <div class="empty">
                    No products found.
                </div>
            `;

    }

}

/* =========================================================
   ADD TO CART
========================================================= */

function addToCart(id,quantity){

    const product=PRODUCTS.find(
        p=>p.id===Number(id)
    );

    if(!product)return;


    const existing=cart.find(
        item=>item.id===product.id
    );


    if(existing){

        existing.quantity+=quantity;

    }else{

        cart.push({
            id:product.id,
            quantity:quantity
        });

    }


    saveCart();

    alert(
        product.name+
        " added to cart!"
    );

}


function addProductDetailToCart(id){

    const input=
        document.getElementById(
            "quantity"
        );

    const quantity=
        Math.max(
            1,
            Number(input?.value)||1
        );

    addToCart(
        id,
        quantity
    );

}


/* =========================================================
   WHATSAPP PRODUCT ORDER
========================================================= */

function quickWhatsApp(id){

    const product=PRODUCTS.find(
        p=>p.id===Number(id)
    );

    if(!product)return;


    const input=
        document.getElementById(
            "quantity"
        );


    const quantity=
        Math.max(
            1,
            Number(input?.value)||1
        );


    const total=
        product.price*quantity;


    const message=
`Hello RS 3D Custom Studio 👋

I want to order:

Product: ${product.name}

Quantity: ${quantity}

Price per item: ₹${product.price}

Total: ₹${total}

Please confirm my order.`;


    window.open(
        "https://wa.me/917708859615?text="+
        encodeURIComponent(message),
        "_blank"
    );

}

function renderCart(){

    if(cart.length===0){

        return `

        <div class="empty">

            <h2>
                🛒 Your cart is empty
            </h2>

            <p style="margin-top:15px">
                Add some products to continue.
            </p>

            <button
                class="btn btn-orange"
                style="margin-top:25px"
                onclick="goHome()"
            >
                Continue Shopping
            </button>

        </div>

        `;

    }


    let grandTotal=0;


    const items=cart.map(item=>{

        const product=PRODUCTS.find(
            p=>p.id===item.id
        );

        if(!product)return "";


        const total=
            product.price*item.quantity;


        grandTotal+=total;


        return `

        <div class="cart-item">

            <img
                src="${product.images[0]}"
                alt="${product.name}"
            >

            <div class="cart-info">

                <h3>
                    ${product.name}
                </h3>

                <p>
                    ₹${product.price}
                    ×
                    ${item.quantity}
                </p>

                <strong>
                    ₹${total}
                </strong>

            </div>


            <button
                class="remove"
                onclick="removeFromCart(${product.id})"
            >
                Remove
            </button>

        </div>

        `;

    }).join("");


    return `

    <section class="cart-container">

        <div class="section-title">

            <h2>
                YOUR <span>CART</span>
            </h2>

        </div>


        ${items}


        <div class="cart-total">

            Grand Total:
            ₹${grandTotal}

        </div>


        <div
            style="
                text-align:right;
                margin-top:25px;
            "
        >

            <button
                class="btn btn-orange"
                onclick="goCheckout()"
            >
                Proceed to Checkout →
            </button>

        </div>

    </section>

    `;

}


function removeFromCart(id){

    cart=cart.filter(
        item=>item.id!==Number(id)
    );

    saveCart();

    render({
        page:"cart"
    });

}

function sendOrderWhatsApp(){

    const name=
        document.getElementById(
            "customerName"
        ).value.trim();


    const phone=
        document.getElementById(
            "customerPhone"
        ).value.trim();


    const address=
        document.getElementById(
            "customerAddress"
        ).value.trim();


    const notes=
        document.getElementById(
            "customerNotes"
        ).value.trim();


    if(!name || !phone || !address){

        alert(
            "Please enter name, phone and address."
        );

        return;

    }


    let grandTotal=0;

    let orderText="";


    cart.forEach((item,index)=>{

        const product=
            PRODUCTS.find(
                p=>p.id===item.id
            );


        if(!product)return;


        const total=
            product.price*
            item.quantity;


        grandTotal+=total;


        orderText+=`

${index+1}. ${product.name}
Quantity: ${item.quantity}
Price per item: ₹${product.price}
Total: ₹${total}
`;

    });


    const message=
`Hello RS 3D Custom Studio 👋

I want to place an order.

CUSTOMER DETAILS

Name: ${name}
Phone: ${phone}
Address: ${address}

ORDER DETAILS:
${orderText}

GRAND TOTAL: ₹${grandTotal}

Additional Notes:
${notes || "None"}

Please confirm my order. Thank you!`;


    window.open(
        "https://wa.me/917708859615?text="+
        encodeURIComponent(message),
        "_blank"
    );

}


/* =========================================================
   GLOBAL SEARCH
========================================================= */

function globalSearch(value){

    const q=
        value
        .trim()
        .toLowerCase();


    if(q===""){

        render(
            history.state ||
            {page:"home"}
        );

        return;

    }


    const results=
        PRODUCTS.filter(product=>{

            const name=
                product.name
                .toLowerCase();

            const description=
                product.description
                .toLowerCase();

            const type=
                product.type
                .toLowerCase();


            const categoryText=
                type==="printing"
                ?
                "3d printing print"
                :
                "craft art gifts customized";


            return(
                name.includes(q) ||
                description.includes(q) ||
                categoryText.includes(q)
            );

        });


    renderSearchResults(
        value,
        results
    );

}


/* =========================================================
   SEARCH RESULTS
========================================================= */

function renderSearchResults(query,results){

    document.getElementById("app").innerHTML=`

    <section class="section">

        <div class="section-title">

            <h2>
                SEARCH <span>RESULTS</span>
            </h2>

            <p>
                Results for "${query}"
            </p>

        </div>


        ${
            results.length
            ?
            `<div class="products">
                ${results.map(productCard).join("")}
            </div>`
            :
            `
            <div class="empty">

                <h2>
                    No products found
                </h2>

                <p style="margin-top:10px">
                    Try another search.
                </p>

            </div>
            `
        }

    </section>

    `;

}


/* =========================================================
   RENDER
========================================================= */

function render(state){

    let html="";


    if(state.page==="home"){

        html=renderHome();

    }
    else if(state.page==="category"){

        html=renderCategory(
            state.type
        );

    }
    else if(state.page==="product"){

        html=renderProduct(
            state.id
        );

    }
    else if(state.page==="cart"){

        html=renderCart();

    }
    else if(state.page==="checkout"){

        html=renderCheckout();

    }
    else{

        html=renderHome();

    }


    document.getElementById(
        "app"
    ).innerHTML=html;


    updateCartCount();

}


/* =========================================================
   START
========================================================= */

if(!history.state){

    history.replaceState(
        {page:"home"},
        "",
        "#home"
    );

}

render(
    history.state ||
    {page:"home"}
);

</script>
