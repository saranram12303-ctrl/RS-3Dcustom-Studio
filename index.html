<title>RS 3D Custom Studio</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#080808;
    color:#f5f5f5;
}

/* HEADER */
header{
    position:sticky;
    top:0;
    z-index:1000;
    background:#050505;
    border-bottom:2px solid #c65d00;
    padding:14px 4%;
    display:flex;
    align-items:center;
    gap:20px;
    flex-wrap:wrap;
}

.logo{
    color:#ff8c00;
    font-size:22px;
    font-weight:bold;
    cursor:pointer;
    text-shadow:
        0 0 5px #ff8c00,
        0 0 15px #8a3f00;
}

.search{
    flex:1;
    min-width:220px;
    padding:12px 16px;
    border-radius:8px;
    border:1px solid #7a3900;
    background:#171717;
    color:white;
    outline:none;
    font-size:15px;
}

.search:focus{
    border-color:#ff8c00;
    box-shadow:0 0 10px #7a3900;
}

nav{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

nav button{
    background:#171717;
    color:#ff8c00;
    border:1px solid #8a4500;
    padding:10px 14px;
    border-radius:7px;
    cursor:pointer;
}

nav button:hover{
    background:#ff7a00;
    color:#000;
}

/* HERO */
.hero{
    min-height:430px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:50px 20px;

    background:
    radial-gradient(
        circle at 50% 20%,
        #7a3200 0%,
        #1a0b00 35%,
        #050505 75%
    );
}

.hero h1{
    font-size:52px;
    color:#ff8c00;
    text-shadow:
        0 0 8px #ff8c00,
        0 0 25px #7a3200;
    margin-bottom:15px;
}

.hero p{
    color:#ddd;
    font-size:18px;
    margin-bottom:30px;
}

.wrap{
    max-width:1200px;
    margin:auto;
    padding:45px 20px;
}

/* HOME CATEGORY CARDS */

.category-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:25px;
}

.big-card{
    min-height:300px;
    padding:35px;
    border-radius:18px;

    background:
    linear-gradient(
        145deg,
        #1c1c1c,
        #100b07
    );

    border:1px solid #713500;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;

    transition:.3s;
}

.big-card:hover{
    transform:translateY(-5px);
    border-color:#ff8c00;
    box-shadow:0 0 25px #542800;
}

.big-card .icon{
    font-size:70px;
    margin-bottom:20px;
}

.big-card h2{
    color:#ff8c00;
    margin-bottom:15px;
}

.big-card p{
    color:#aaa;
    margin-bottom:20px;
}

/* BUTTONS */

.btn{
    border:none;
    padding:12px 20px;
    border-radius:8px;
    cursor:pointer;
    font-size:15px;
    font-weight:bold;
    margin:5px;
}

.primary{
    background:
    linear-gradient(
        145deg,
        #ff9d00,
        #c65300
    );
    color:#000;
}

.primary:hover{
    box-shadow:0 0 15px #ff8c00;
}

.secondary{
    background:#171717;
    color:#ff8c00;
    border:1px solid #8a4500;
}

.secondary:hover{
    background:#ff7a00;
    color:#000;
}

/* PRODUCT GRID */

.product-grid{
    display:grid;
    grid-template-columns:
    repeat(auto-fit,minmax(230px,1fr));
    gap:22px;
    margin-top:25px;
}

.product-card{
    background:
    linear-gradient(
        145deg,
        #111,
        #1b120d
    );

    border:1px solid #633000;
    border-radius:14px;
    overflow:hidden;
    transition:.3s;
}

.product-card:hover{
    transform:translateY(-5px);
    border-color:#ff7b00;
    box-shadow:0 0 20px #542800;
}

.product-card img{
    width:100%;
    height:220px;
    object-fit:cover;
    background:#080808;
}

.product-content{
    padding:16px;
}

.product-content h3{
    color:#fff;
    margin-bottom:8px;
}

.product-content p{
    color:#999;
    font-size:14px;
    margin-bottom:10px;
}

.price{
    color:#ff8c00;
    font-size:20px;
    font-weight:bold;
    margin-bottom:12px;
}

/* PRODUCT DETAIL */

.detail{
    background:
    linear-gradient(
        145deg,
        #111,
        #1b120d
    );

    border:1px solid #6f3400;
    border-radius:15px;
    padding:25px;
}

.detail-layout{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:35px;
}

.main-image{
    width:100%;
    height:480px;
    object-fit:contain;
    background:#080808;
    border:1px solid #713500;
    border-radius:10px;
}

.thumbnails{
    display:flex;
    gap:10px;
    margin-top:12px;
    overflow-x:auto;
}

.thumbnails img{
    width:80px;
    height:70px;
    object-fit:cover;
    border:2px solid #333;
    border-radius:6px;
    cursor:pointer;
}

.thumbnails img.active{
    border-color:#ff8c00;
}

.detail h1{
    color:#ff8c00;
    margin-bottom:15px;
}

.detail .description{
    color:#bbb;
    line-height:1.7;
    margin-bottom:20px;
}

.option{
    margin:15px 0;
}

.option label{
    display:block;
    color:#ff8c00;
    margin-bottom:7px;
    font-weight:bold;
}

.option select,
.option input{
    width:100%;
    padding:12px;
    background:#111;
    color:white;
    border:1px solid #633000;
    border-radius:7px;
}

/* CART */

.cart-item{
    display:flex;
    align-items:center;
    gap:20px;
    padding:15px;
    margin-bottom:12px;
    background:#111;
    border:1px solid #542800;
    border-radius:10px;
}

.cart-item img{
    width:100px;
    height:90px;
    object-fit:cover;
    border-radius:8px;
}

.cart-item-info{
    flex:1;
}

.cart-item-info h3{
    color:#ff8c00;
    margin-bottom:7px;
}

.cart-item-info p{
    color:#aaa;
}

.cart-total{
    margin-top:25px;
    padding:25px;
    background:
    linear-gradient(
        145deg,
        #111,
        #1c1008
    );
    border:1px solid #713500;
    border-radius:10px;
    text-align:right;
}

.cart-total h2{
    color:#ff8c00;
    margin-bottom:15px;
}

/* CHECKOUT */

.checkout-box{
    max-width:700px;
    margin:auto;

    background:
    linear-gradient(
        145deg,
        #111,
        #1b120d
    );

    border:1px solid #713500;
    border-radius:15px;
    padding:30px;
}

.checkout-box h1{
    color:#ff8c00;
    margin-bottom:25px;
}

.checkout-box input,
.checkout-box textarea{
    width:100%;
    margin-bottom:15px;
    padding:13px;
    border-radius:7px;
    background:#111;
    border:1px solid #633000;
    color:white;
}

.checkout-box textarea{
    min-height:100px;
    resize:vertical;
}

/* EMPTY */

.empty{
    text-align:center;
    padding:60px 20px;
    color:#aaa;
}

/* WHATSAPP */

.float-wa{
    position:fixed;
    right:20px;
    bottom:20px;

    width:58px;
    height:58px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;

    background:#25D366;
    color:white;

    font-size:30px;
    text-decoration:none;

    box-shadow:0 5px 20px rgba(0,0,0,.5);

    z-index:999;
}

/* FOOTER */

footer{
    background:#050505;
    border-top:1px solid #542800;
    text-align:center;
    padding:30px 20px;
    margin-top:40px;
}

footer b{
    color:#ff8c00;
}

/* RESPONSIVE */

@media(max-width:800px){

    header{
        flex-direction:column;
        align-items:stretch;
    }

    nav{
        justify-content:center;
    }

    .category-grid{
        grid-template-columns:1fr;
    }

    .hero h1{
        font-size:38px;
    }

    .detail-layout{
        grid-template-columns:1fr;
    }

    .main-image{
        height:350px;
    }

    .cart-item{
        flex-direction:column;
        align-items:flex-start;
    }

    .cart-item img{
        width:100%;
        height:200px;
    }
}
</style>

   CART
===================================================== */

let cart = JSON.parse(
    localStorage.getItem("rs3d_cart") || "[]"
);

function saveCart(){

    localStorage.setItem(
        "rs3d_cart",
        JSON.stringify(cart)
    );

    updateCartCount();
}

function updateCartCount(){

    const count = cart.reduce(
        (sum,item)=>sum + item.quantity,
        0
    );

    const element =
        document.getElementById("cartCount");

    if(element){
        element.textContent = count;
    }
}


/* =====================================================
   NAVIGATION
===================================================== */

function navigate(state){

    let hash="#home";

    if(state.page==="category"){
        hash="#"+state.type;
    }

    if(state.page==="product"){
        hash="#product-"+state.id;
    }

    if(state.page==="cart"){
        hash="#cart";
    }

    if(state.page==="checkout"){
        hash="#checkout";
    }

    history.pushState(
        state,
        "",
        hash
    );

    render(state);
}

function goHome(){
    navigate({
        page:"home"
    });
}

function goCategory(type){
    navigate({
        page:"category",
        type:type
    });
}

function goProduct(id){
    navigate({
        page:"product",
        id:id
    });
}

function goCart(){
    navigate({
        page:"cart"
    });
}

function goCheckout(){
    navigate({
        page:"checkout"
    });
}

/* =====================================================
   CATEGORY SEARCH
===================================================== */

function categorySearch(
    type,
    value
){

    const q =
        value
        .trim()
        .toLowerCase();

    const products =
        PRODUCTS.filter(
            p =>
                p.type===type &&
                (
                    p.name
                    .toLowerCase()
                    .includes(q)
                    ||
                    p.description
                    .toLowerCase()
                    .includes(q)
                )
        );

    const container =
        document.getElementById(
            "categoryProducts"
        );

    if(!container){
        return;
    }

    container.innerHTML =
        products.length
        ?
        products.map(productCard).join("")
        :
        `
        <div class="empty">

            <h2>
                ❌ No Product Found
            </h2>

            <p>
                Try another product name.
            </p>

        </div>
        `;

}


/* =====================================================
   GLOBAL SEARCH
===================================================== */

function globalSearch(value){

    const q =
        value
        .trim()
        .toLowerCase();


    /*
       If search box is empty,
       restore the current page.
    */

    if(q===""){

        render(
            history.state || {
                page:"home"
            }
        );

        return;
    }


    /*
       Search product name,
       description and category.
    */

    const results =
        PRODUCTS.filter(product=>{

            const name =
                String(
                    product.name || ""
                ).toLowerCase();

            const description =
                String(
                    product.description || ""
                ).toLowerCase();

            const type =
                String(
                    product.type || ""
                ).toLowerCase();


            const categoryText =
                type==="printing"
                ?
                "3d printing print"
                :
                "craft art gifts customized";


            return (

                name.includes(q)

                ||

                description.includes(q)

                ||

                categoryText.includes(q)

            );

        });


    renderSearchResults(
        value,
        results
    );

}

/* =====================================================
   ESCAPE SEARCH TEXT
===================================================== */

function escapeHTML(text){

    return String(text)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );
}

/* =====================================================
   ADD TO CART
===================================================== */

function addToCart(id){

    const product =
        PRODUCTS.find(
            p=>p.id===Number(id)
        );

    if(!product){
        return;
    }


    const quantity =
        Math.max(
            1,
            Number(
                document.getElementById(
                    "quantity"
                ).value
            ) || 1
        );


    const colour =
        document.getElementById(
            "colour"
        ).value;


    const existing =
        cart.find(
            item =>
                item.id===product.id &&
                item.colour===colour
        );


    if(existing){

        existing.quantity += quantity;

    }
    else{

        cart.push({

            id:product.id,

            name:product.name,

            price:product.price,

            image:product.images[0],

            colour:colour,

            quantity:quantity

        });

    }


    saveCart();


    alert(
        "✅ Product added to cart!"
    );

}

  Colour: ${item.colour}
  Qty: ${item.quantity}
  Price: ₹${itemTotal}
`;

        }
    );


    message +=
`
TOTAL: ₹${total}

Additional Notes:
${notes || "None"}

Thank you!`;



    window.open(
        "https://wa.me/917708859615?text="+
        encodeURIComponent(message),
        "_blank"
    );

}


/* =====================================================
   RENDER
===================================================== */

function render(state){

    if(!state){
        state={
            page:"home"
        };
    }


    if(state.page==="home"){

        renderHome();

    }

    else if(
        state.page==="category"
    ){

        renderCategory(
            state.type
        );

    }

    else if(
        state.page==="product"
    ){

        renderProduct(
            state.id
        );

    }

    else if(
        state.page==="cart"
    ){

        renderCart();

    }

    else if(
        state.page==="checkout"
    ){

        renderCheckout();

    }

    else{

        renderHome();

    }


    updateCartCount();

}


/* =====================================================
   INITIAL LOAD
===================================================== */

(function(){

    const hash =
        window.location.hash;


    if(
        hash.startsWith(
            "#product-"
        )
    ){

        const id =
            Number(
                hash.replace(
                    "#product-",
                    ""
                )
            );

        const state={
            page:"product",
            id:id
        };

        history.replaceState(
            state,
            "",
            hash
        );

        render(state);

    }

    else if(
        hash==="#printing"
    ){

        const state={
            page:"category",
            type:"printing"
        };

        history.replaceState(
            state,
            "",
            hash
        );

        render(state);

    }

    else if(
        hash==="#craft"
    ){

        const state={
            page:"category",
            type:"craft"
        };

        history.replaceState(
            state,
            "",
            hash
        );

        render(state);

    }

    else if(
        hash==="#cart"
    ){

        const state={
            page:"cart"
        };

        history.replaceState(
            state,
            "",
            hash
        );

        render(state);

    }

    else{

        const state={
            page:"home"
        };

        history.replaceState(
            state,
            "",
            "#home"
        );

        render(state);

    }

})();

</script>
