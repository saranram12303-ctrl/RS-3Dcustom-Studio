<title>RS 3D Custom Studio</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f5f7f6;
    color:#17201e;
}

header{
    background:#071b18;
    color:white;
    padding:14px 5%;
    display:flex;
    align-items:center;
    gap:20px;
    position:sticky;
    top:0;
    z-index:1000;
}

.logo{
    font-size:23px;
    font-weight:bold;
    white-space:nowrap;
}

.logo span{
    color:#ff9f00;
}

.search{
    flex:1;
    max-width:350px;
    padding:11px 14px;
    border:0;
    border-radius:8px;
    outline:none;
}

nav{
    margin-left:auto;
    display:flex;
    gap:15px;
}

nav button{
    background:none;
    border:0;
    color:white;
    cursor:pointer;
    font-weight:bold;
}

nav button:hover{
    color:#ffae22;
}

.hero{
    padding:45px 5%;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:25px;
    background:linear-gradient(135deg,#e5f8f3,#fff0dd);
}

.hero-box{
    min-height:270px;
    padding:40px;
    border-radius:22px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    box-shadow:0 8px 25px rgba(0,0,0,.08);
}

.hero-3d{
    background:linear-gradient(135deg,#d9f5ef,#ffffff);
}

.hero-craft{
    background:linear-gradient(135deg,#fff0dc,#ffffff);
}

.hero h1{
    font-size:40px;
    margin:15px 0;
}

.hero p{
    color:#596762;
    margin-bottom:20px;
    line-height:1.6;
}

.tag{
    display:inline-block;
    width:max-content;
    padding:6px 11px;
    border-radius:20px;
    background:#dff5ef;
    color:#087965;
    font-size:12px;
    font-weight:bold;
}

.btn{
    border:0;
    padding:12px 18px;
    border-radius:8px;
    background:#087d6b;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

.btn:hover{
    opacity:.88;
}

.orange{
    background:#f59e0b;
    color:#111;
}

section{
    padding:40px 5%;
}

.section-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:22px;
}

.section-head h2{
    font-size:28px;
}

.product-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:18px;
}

.product-card{
    background:white;
    border-radius:14px;
    overflow:hidden;
    border:1px solid #e3e9e7;
    box-shadow:0 4px 16px rgba(0,0,0,.07);
    transition:.2s;
}

.product-card:hover{
    transform:translateY(-4px);
    box-shadow:0 8px 25px rgba(0,0,0,.12);
}

.product-card img{
    width:100%;
    aspect-ratio:1/1;
    object-fit:cover;
    display:block;
}

.product-info{
    padding:14px;
}

.product-info h3{
    margin:8px 0;
    font-size:17px;
}

.category{
    color:#687570;
    font-size:13px;
}

.price{
    color:#087d6b;
    font-size:20px;
    font-weight:bold;
    margin:10px 0;
}

.product-info .btn{
    width:100%;
}

.details{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:30px;
    background:white;
    padding:25px;
    border-radius:18px;
}

.gallery{
    display:grid;
    grid-template-columns:75px 1fr;
    gap:12px;
}

.thumbs img{
    width:68px;
    height:68px;
    object-fit:cover;
    margin-bottom:9px;
    border-radius:8px;
    cursor:pointer;
    border:2px solid transparent;
}

.thumbs img.active{
    border-color:#087d6b;
}

.main-image{
    width:100%;
    border-radius:14px;
}

.details-info h1{
    font-size:32px;
    margin:12px 0;
}

.field{
    margin:15px 0;
}

.field label{
    display:block;
    margin-bottom:6px;
    font-weight:bold;
}

select,
input,
textarea{
    width:100%;
    padding:11px;
    border:1px solid #ccd7d4;
    border-radius:8px;
    outline:none;
}

.actions{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.cart-item{
    display:grid;
    grid-template-columns:80px 1fr auto;
    gap:15px;
    align-items:center;
    background:white;
    padding:12px;
    border-bottom:1px solid #eee;
}

.cart-item img{
    width:80px;
    height:80px;
    object-fit:cover;
    border-radius:8px;
}

.cart-total{
    background:white;
    padding:20px;
    border-radius:12px;
    margin-top:18px;
    display:flex;
    justify-content:space-between;
    font-size:22px;
    font-weight:bold;
}

.empty{
    background:white;
    padding:30px;
    border-radius:12px;
    text-align:center;
}

footer{
    background:#071b18;
    color:white;
    text-align:center;
    padding:25px;
    margin-top:30px;
}

.whatsapp{
    position:fixed;
    right:18px;
    bottom:18px;
    width:58px;
    height:58px;
    border-radius:50%;
    background:#20c76a;
    color:white;
    display:grid;
    place-items:center;
    text-decoration:none;
    font-size:27px;
    z-index:100;
    box-shadow:0 5px 20px rgba(0,0,0,.25);
}

@media(max-width:900px){

    .product-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .hero{
        grid-template-columns:1fr;
    }

    .details{

    }

    nav{
        width:100%;
        justify-content:center;
    }

    header{
        flex-wrap:wrap;
    }

    .search{
        order:3;
        width:100%;
        max-width:none;
    }
}

@media(max-width:500px){

    .product-grid{
        grid-template-columns:1fr;
    }

    .hero h1{
        font-size:30px;
    }

    .hero-box{
        padding:25px;
    }

    .section-head{
        flex-direction:column;
        align-items:flex-start;
        gap:10px;
    }

    .cart-item{
        grid-template-columns:60px 1fr;
    }
}
</style>
</head>

/* =========================================================
   CREATE UNIQUE PRODUCT IMAGES
   These are generated locally by the browser.
   No external image website required.
========================================================= */

function createProductImage(product,index,view){

    let colors = [
        ["#087d6b","#dff5ef","#f59e0b"],
        ["#2563eb","#e5edff","#f97316"],
        ["#7c3aed","#eee7ff","#14b8a6"],
        ["#be123c","#ffe8ed","#eab308"]
    ];

    let color =
        colors[(index + view) % colors.length];

    let main = color[0];
    let light = color[1];
    let accent = color[2];

    let shape = "";

    if(view === 0){

        shape = `
        <rect
            x="220"
            y="130"
            width="360"
            height="270"
            rx="35"
            fill="${main}"
        />

        <circle
            cx="400"
            cy="265"
            r="82"
            fill="${accent}"
        />
        `;

    }

    else if(view === 1){

        shape = `
        <g transform="rotate(-8 400 270)">

            <rect
                x="230"
                y="125"
                width="340"
                height="290"
                rx="35"
                fill="${main}"
            />

            <rect
                x="280"
                y="175"
                width="240"
                height="150"
                rx="20"
                fill="${light}"
            />

        </g>
        `;

    }

    else if(view === 2){

        shape = `
        <rect
            x="160"
            y="165"
            width="480"
            height="210"
            rx="35"
            fill="${light}"
            stroke="${main}"
            stroke-width="18"
        />

        <circle
            cx="400"
            cy="270"
            r="65"
            fill="${accent}"
        />

        <path
            d="M250 405 Q400 345 550 405"
            fill="none"
            stroke="${main}"
            stroke-width="14"
        />
        `;

    }

    else{

        shape = `
        <polygon
            points="400,100 590,215 530,420 270,420 210,215"
            fill="${light}"
            stroke="${main}"
            stroke-width="18"
        />

        <circle
            cx="400"
            cy="265"
            r="72"
            fill="${accent}"
        />

        <path
            d="M315 355 L485 355"
            stroke="${main}"
            stroke-width="14"
        />
        `;

    }


    let svg = `

    <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 800 600"
    >

        <rect
            width="800"
            height="600"
            fill="${light}"
        />

        <ellipse
            cx="400"
            cy="470"
            rx="240"
            ry="28"
            fill="#000"
            opacity="0.12"
        />

        ${shape}

        <text
            x="400"
            y="525"
            text-anchor="middle"
            font-family="Arial"
            font-size="28"
            font-weight="bold"
            fill="#111"
        >
            ${product.name}
        </text>

        <text
            x="400"
            y="560"
            text-anchor="middle"
            font-family="Arial"
            font-size="19"
            fill="#555"
        >
            ${product.category} • View ${view + 1}
        </text>

    </svg>

    `;

    return "data:image/svg+xml;charset=UTF-8," +
        encodeURIComponent(svg);
}


/* Add 4 different images to every product */

products.forEach((product,index)=>{

    product.images = [];

    for(let i=0;i<4;i++){

        product.images.push(
            createProductImage(
                product,
                index,
                i
            )
        );

});

function saveCart(){

}


function updateCartCount(){

    let count = cart.reduce(
        (total,item)=>total + item.qty,
        0
    );

    document.getElementById(
        "cartCount"
    ).innerText = count;

}

/* =========================================================
   PRODUCT CARD
========================================================= */

function productCard(product){

    return `

    <article class="product-card">

        <img
            src="${product.images[0]}"
            alt="${product.name}"
        >

        <div class="product-info">

            <span class="tag">
                ${product.type}
            </span>

            <h3>
                ${product.name}
            </h3>

            <div class="category">
                ${product.category}
            </div>

            <div class="price">
                ₹${product.price}
            </div>

            <button
                class="btn"
                onclick="openProduct('${product.id}')"
            >
                View Details
            </button>

        </div>

    </article>

    `;

}


/* =========================================================
   RENDER PRODUCTS
========================================================= */

function renderProducts(){

    let search =
        document.getElementById(
            "search"
        ).value
        .toLowerCase();


    let list =
        products.filter(product=>{

            let categoryMatch =
                product.type ===
                window.currentCategory;

            let searchMatch =
                (
                    product.name +
                    " " +
                    product.category
                )
                .toLowerCase()
                .includes(search);


            return categoryMatch &&
                   searchMatch;

        });


    let container =
        document.getElementById(
            "products"
        );


    if(!container){
        return;
    }


    if(list.length === 0){

        container.innerHTML = `

        <div class="empty">

            <h3>
                Product not found
            </h3>

            <p>
                Try another product name.
            </p>

        </div>

        `;

        return;

    }


    container.innerHTML =
        list
        .map(productCard)
        .join("");

}

   SEARCH

function searchProducts(){

    if(window.currentCategory){

        renderProducts();

    }

}

let currentProduct = null;

                    src="${currentProduct.images[0]}"
                >

            </div>


            <div class="details-info">

                    ${currentProduct.type}
                </span>

                    ${currentProduct.name}
                </h1>

                    ₹${currentProduct.price}

                        Size

                    <select id="size">

                        <option>
                            Small
                        </option>

                        <option selected>
                            Medium
                        </option>

                        </option>

                    <button

                        onclick="addToCart()"
                    >
                        🛒 Add to Cart
                    </button>

                    >

                    </button>

                </div>


            </div>

        </div>

    </section>

    `;

}


function changeImage(src,element){

    document.getElementById(
        "mainImage"
    ).src = src;


    document
        .querySelectorAll(".thumbs img")
        .forEach(
            image=>{
                image.classList.remove(
                    "active"
                );
            }
        );


    element.classList.add("active");

}


/* =========================================================
   ADD TO CART
========================================================= */

function addToCart(){

    let quantity =
        parseInt(
            document.getElementById(
                "quantity"
            ).value
        ) || 1;


    let size =
        document.getElementById(
            "size"
        ).value;


    let colour =
        document.getElementById(
            "colour"
        ).value;


    let existing =
        cart.find(
            item=>
                item.id === currentProduct.id &&
                item.size === size &&
                item.colour === colour
        );


    if(existing){

        existing.qty += quantity;

    }

    else{

        cart.push({

            id:currentProduct.id,

            name:currentProduct.name,

            price:currentProduct.price,

            image:currentProduct.images[0],

            qty:quantity,

            size:size,

            colour:colour

        });

    }


    saveCart();

    showCart();

}

    renderCart();

}


function renderCart(){

    let container =
        document.getElementById(
            "cartItems"
        );


    if(!cart.length){

        container.innerHTML = `

        <div class="empty">

            <h3>
                Your cart is empty
            </h3>

            <br>

            <button
                class="btn"
                onclick="homePage()"
            >
                Continue Shopping
            </button>

        </div>

        `;


        document.getElementById(
            "cartTotal"
        ).innerText = "₹0";

        return;

    }


    container.innerHTML =
        cart.map(
            (item,index)=>`

            <div class="cart-item">

                <img
                    src="${item.image}"
                >


                <div>

                    <h3>
                        ${item.name}
                    </h3>

                    <p>
                        Size: ${item.size}
                    </p>

                    <p>
                        Colour: ${item.colour}
                    </p>

                    <p>
                        ₹${item.price}
                    </p>


                    <input
                        type="number"
                        min="1"
                        value="${item.qty}"
                        style="width:75px"
                        onchange="updateQuantity(${index},this.value)"
                    >

                </div>


                <button
                    onclick="removeCartItem(${index})"
                >
                    ❌
                </button>

            </div>

            `
        )
        .join("");


    let total =
        cart.reduce(
            (sum,item)=>
                sum +
                item.price *
                item.qty,
            0
        );


    document.getElementById(
        "cartTotal"
    ).innerText =
        "₹" + total;

}


/* =========================================================
   UPDATE CART
========================================================= */

function updateQuantity(index,value){

    let quantity =
        parseInt(value) || 1;


    if(quantity < 1){
        quantity = 1;
    }


    cart[index].qty =
        quantity;


    saveCart();

    renderCart();

}


function removeCartItem(index){

    cart.splice(
        index,
        1
    );


    saveCart();

    renderCart();

}
