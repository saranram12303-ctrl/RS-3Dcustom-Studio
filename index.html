<html lang="en">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RS 3D Custom Studio</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f5f6fa;
    color:#111827;
}

button{
    font-family:inherit;
}

header{
    position:sticky;
    top:0;
    z-index:1000;
    background:#111827;
    color:white;
    padding:14px 18px;
    display:flex;
    align-items:center;
    gap:15px;
    flex-wrap:wrap;
}

.logo{
    font-size:20px;
    font-weight:bold;
    cursor:pointer;
    white-space:nowrap;
}

.search{
    flex:1;
    min-width:180px;
    padding:12px 15px;
    border:none;
    border-radius:10px;
    outline:none;
    font-size:14px;
}

nav{
    display:flex;
    gap:7px;
    flex-wrap:wrap;
}

nav button{
    background:#374151;
    color:white;
    border:0;
    padding:10px 12px;
    border-radius:9px;
    cursor:pointer;
}

nav button:hover{
    background:#4b5563;
}

.hero{
    background:linear-gradient(135deg,#111827,#312e81,#7c3aed);
    color:white;
    text-align:center;
    padding:65px 20px;
}

.hero h1{
    font-size:40px;
    margin-bottom:12px;
}

.hero p{
    font-size:17px;
    opacity:.9;
}

.wrap{
    max-width:1200px;
    margin:auto;
    padding:25px 18px;
}

.section-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:22px;
    margin-top:25px;
}

.big-card{
    min-height:270px;
    padding:30px;
    border-radius:24px;
    color:white;
    display:flex;
    flex-direction:column;
    justify-content:center;
    box-shadow:0 10px 30px #0002;
}

.print-card{
    background:linear-gradient(135deg,#2563eb,#06b6d4);
}

.craft-card{
    background:linear-gradient(135deg,#9333ea,#ec4899);
}

.big-card h2{
    font-size:28px;
    margin-bottom:12px;
}

.big-card p{
    line-height:1.6;
    margin-bottom:20px;
}

.btn{
    border:0;
    border-radius:10px;
    padding:11px 15px;
    cursor:pointer;
    font-weight:bold;
}

.primary{
    background:#111827;
    color:white;
}

.secondary{
    background:#e5e7eb;
    color:#111827;
}

.whatsapp{
    background:#16a34a;
    color:white;
}

.white-btn{
    background:white;
    color:#111827;
}

.controls{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin:18px 0;
}

.controls input,
.controls select{
    padding:11px 13px;
    border:1px solid #d1d5db;
    border-radius:10px;
    background:white;
}

.product-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(210px,1fr));
    gap:18px;
}

.product-card{
    background:white;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 5px 20px #00000012;
    transition:.2s;
}

.product-card:hover{
    transform:translateY(-3px);
}

.product-card img{
    width:100%;
    height:200px;
    object-fit:cover;
    background:#eef2ff;
}

.product-info{
    padding:15px;
}

.product-info h3{
    font-size:17px;
    min-height:42px;
}

.price{
    font-size:20px;
    font-weight:bold;
    margin:10px 0;
}

.product-actions{
    display:flex;
    gap:8px;
}

.product-actions button{
    flex:1;
}

.detail{
    background:white;
    padding:22px;
    border-radius:20px;
    box-shadow:0 5px 20px #00000012;
}

.gallery{
    display:grid;
    grid-template-columns:2fr 1fr;
    gap:15px;
    margin-top:20px;
}

.main-image{
    width:100%;
    height:430px;
    object-fit:contain;
    background:#f3f4f6;
    border-radius:15px;
}

.thumbnails{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.thumbnails img{
    width:100%;
    height:100px;
    object-fit:cover;
    border-radius:10px;
    cursor:pointer;
    border:3px solid transparent;
}

.thumbnails img.active{
    border-color:#4f46e5;
}

.detail h1{
    margin-top:22px;
}

.detail-description{
    color:#4b5563;
    margin:12px 0;
    line-height:1.6;
}

.option-row{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin:18px 0;
}

.option-row select,
.option-row input{
    padding:11px;
    border:1px solid #d1d5db;
    border-radius:9px;
}

.cart-item{
    display:grid;
    grid-template-columns:80px 1fr auto;
    gap:15px;
    align-items:center;
    background:white;
    padding:12px;
    border-radius:15px;
    margin:12px 0;
}

.cart-item img{
    width:80px;
    height:80px;
    object-fit:cover;
    border-radius:10px;
}

.cart-total{
    background:white;
    padding:20px;
    border-radius:15px;
    margin-top:20px;
}

.checkout-box{
    background:white;
    padding:25px;
    border-radius:18px;
    max-width:700px;
    margin:auto;
}

.checkout-box input,
.checkout-box textarea{
    width:100%;
    padding:13px;
    margin:8px 0;
    border:1px solid #d1d5db;
    border-radius:10px;
}

.checkout-box textarea{
    min-height:120px;
}

.empty{
    text-align:center;
    padding:60px 20px;
}

footer{
    text-align:center;
    padding:35px 20px;
    margin-top:30px;
    color:#6b7280;
}

.float-wa{
    position:fixed;
    right:18px;
    bottom:18px;
    width:55px;
    height:55px;
    border-radius:50%;
    background:#16a34a;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:25px;
    text-decoration:none;
    box-shadow:0 5px 20px #0004;
    z-index:999;
}

@media(max-width:750px){

    header{
        position:relative;
    }

    .section-grid{
        grid-template-columns:1fr;
    }

    .hero h1{
        font-size:30px;
    }

    nav{
        width:100%;
    }

    nav button{
        flex:1;
        font-size:12px;
    }

    .product-grid{
        grid-template-columns:repeat(2,1fr);
        gap:12px;
    }

    .product-card img{
        height:150px;
    }

    .gallery{
        grid-template-columns:1fr;
    }

    .main-image{
        height:300px;
    }

    .cart-item{
        grid-template-columns:65px 1fr;
    }

    .cart-item button{
        grid-column:2;
    }
}
</style>
</head>

/* =========================================================
   CART
========================================================= */

let cart = JSON.parse(localStorage.getItem("RS_CART") || "[]");

function saveCart(){
    localStorage.setItem("RS_CART",JSON.stringify(cart));
    updateCartCount();
}

function updateCartCount(){

    const count = cart.reduce(
        (total,item)=>total + item.qty,
        0
    );

    document.getElementById("cartCount").textContent=count;
}


/* =========================================================
   BROWSER HISTORY
========================================================= */

function navigate(state){

    let hash="#home";

    if(state.page==="category"){
        hash="#"+state.type;
    }

    if(state.page==="product"){
        hash="#product-"+state.id;
    }

    if(state.page==="cart"){
        hash="#cart";
    }

    if(state.page==="checkout"){
        hash="#checkout";
    }

    history.pushState(state,"",hash);

    render(state);
}


function goHome(){
    navigate({
        page:"home"
    });
}


function goCategory(type){
    navigate({
        page:"category",
        type:type
    });
}


function goProduct(id){
    navigate({
        page:"product",
        id:id
    });
}


function goCart(){
    navigate({
        page:"cart"
    });
}


function goCheckout(){
    navigate({
        page:"checkout"
    });
}


window.addEventListener(
    "popstate",
    function(event){

        if(event.state){
            render(event.state);
        }
        else{
            render({
                page:"home"
            });
        }

    }
);

/* =========================================================
   CATEGORY
========================================================= */

function renderCategory(type,searchText=""){

    const isPrinting = type==="printing";

    const title = isPrinting
        ? "🖨️ 3D Printing"
        : "🎨 Customized Art, Craft & Gifts";


    const products = PRODUCTS.filter(product=>{

        return product.type===type &&
        product.name
        .toLowerCase()
        .includes(searchText.toLowerCase());

    });


    document.getElementById("app").innerHTML=`

    <div class="wrap">

        <button
        class="btn secondary"
        onclick="goHome()"
        >
        ← Home
        </button>

        <h1 style="margin-top:18px">
        ${title}
        </h1>


        <div class="controls">

            <input
            id="categorySearch"
            placeholder="Search products..."
            value="${searchText}"
            oninput="categorySearch('${type}',this.value)"
            >

        </div>


        <div class="product-grid">

        ${
            products.length
            ?
            products.map(productCard).join("")
            :
            `<div class="empty">
                <h2>No products found</h2>
            </div>`
        }

        </div>

    </div>
    `;
}


function categorySearch(type,value){

}

========================================================= */

function globalSearch(value){

    value=value.trim();

    }


    const results=PRODUCTS.filter(product=>

        product.name
        .toLowerCase()
        .includes(value.toLowerCase())

    );


    document.getElementById("app").innerHTML=`

    <div class="wrap">

        <h1>
        Search Results
        </h1>

        <p style="margin:10px 0 20px">
        ${results.length} product(s) found

        <div class="product-grid">

            results.map(productCard).join("")
            :
            `<div class="empty">
                <h2>No products found</h2>
            </div>`
        }

    </div>

function changeMainImage(src,element){

    document.getElementById(
        "mainProductImage"
    ).src=src;


    document
    .querySelectorAll(".thumbnails img")
    .forEach(image=>{

        image.classList.remove("active");

    });


    element.classList.add("active");

}


/* =========================================================
   ADD TO CART
========================================================= */

function addToCart(id){

    const product=PRODUCTS.find(
        p=>p.id===id
    );


    const quantity=Math.max(
        1,
        Number(
            document.getElementById(
                "productQty"
            ).value
        ) || 1
    );


    const size=
        document.getElementById(
            "productSize"
        ).value;


    const colour=
        document.getElementById(
            "productColour"
        ).value;


    const key=
        id+"-"+size+"-"+colour;


    const existing=
        cart.find(item=>item.key===key);


    if(existing){

        existing.qty += quantity;

    }
    else{

        cart.push({

            key:key,
            id:id,
            qty:quantity,
            size:size,
            colour:colour

        });

    }


    saveCart();


    alert(
        product.name+
        " added to cart ✅"
    );

}

   WHATSAPP

const WHATSAPP_NUMBER="917708859615";


function quickWhatsApp(id){

    const product=PRODUCTS.find(
        p=>p.id===id
    );


    const message=
`Hi RS 3D Custom Studio 👋

I am interested in:

Product: ${product.name}
Price: ₹${product.price}

Please share customization details.`;


    window.open(
        "https://wa.me/"+
        WHATSAPP_NUMBER+
        "?text="+
        encodeURIComponent(message),
        "_blank"
    );

}


/* =========================================================
   CART
========================================================= */

function renderCart(){

    if(cart.length===0){

        document.getElementById("app").innerHTML=`

        <div class="wrap">

            <div class="empty">

                <h1>🛒 Your Cart is Empty</h1>

                <p style="margin:15px">
                Add some products to continue.
                </p>

                <button
                class="btn primary"
                onclick="goHome()"
                >
                Continue Shopping
                </button>

            </div>

        </div>

        `;

        return;

    }


    let total=0;


    const items=cart.map(
        (item,index)=>{

            const product=
                PRODUCTS.find(
                    p=>p.id===item.id
                );


            const subtotal=
                product.price*
                item.qty;


            total+=subtotal;


            return `

            <div class="cart-item">

                <img
                src="${product.images[0]}"
                >


                <div>

                    <h3>
                    ${product.name}
                    </h3>

                    <p>
                    Size: ${item.size}
                    </p>

                    <p>
                    Colour: ${item.colour}
                    </p>

                    <p>
                    ₹${product.price}
                    × ${item.qty}
                    </p>

                </div>


                <button
                class="btn secondary"
                onclick="removeFromCart(${index})"
                >
                Remove
                </button>

            </div>

            `;

        }
    ).join("");


    document.getElementById("app").innerHTML=`

    <div class="wrap">

        <h1>🛒 Your Cart</h1>

        ${items}


        <div class="cart-total">

            <h2>
            Total: ₹${total}
            </h2>


            <br>


            <button
            class="btn primary"
            onclick="goCheckout()"
            >
            Proceed to Checkout
            </button>


            <button
            class="btn secondary"
            onclick="goHome()"
            >
            Continue Shopping
            </button>

        </div>

    </div>

    `;
}


function removeFromCart(index){

    cart.splice(index,1);

    saveCart();

    renderCart();

}


/* =========================================================
   CHECKOUT
========================================================= */

function renderCheckout(){

    if(cart.length===0){

        goCart();

        return;

    }


    let total=0;


    cart.forEach(item=>{

        const product=
            PRODUCTS.find(
                p=>p.id===item.id
            );


        total+=
            product.price*
            item.qty;

    });


    document.getElementById("app").innerHTML=`

    <div class="wrap">

        <div class="checkout-box">

            <h1>
            Checkout
            </h1>


            <p style="margin:10px 0">
            Enter your details and send the order
            directly to WhatsApp.
            </p>


            <input
            id="customerName"
            placeholder="Your Name"
            >


            <input
            id="customerPhone"
            placeholder="Phone Number"
            type="tel"
            >


            <textarea
            id="customerAddress"
            placeholder="Delivery Address"
            ></textarea>


            <h2>
            Total: ₹${total}
            </h2>


            <br>


            <button
            class="btn whatsapp"
            style="width:100%"
            onclick="sendOrderWhatsApp()"
            >
            💬 Send Order on WhatsApp
            </button>


            <br><br>


            <button
            class="btn secondary"
            onclick="goCart()"
            >
            ← Back to Cart
            </button>

        </div>

    </div>

    `;
}


/* =========================================================
   SEND ORDER
========================================================= */

function sendOrderWhatsApp(){

    const name=
        document.getElementById(
            "customerName"
        ).value.trim();


    const phone=
        document.getElementById(
            "customerPhone"
        ).value.trim();


    const address=
        document.getElementById(
            "customerAddress"
        ).value.trim();


    if(!name || !phone || !address){

        alert(
            "Please enter Name, Phone and Address."
        );

        return;

    }


    let message=
`Hi RS 3D Custom Studio 👋

New Order

Name: ${name}
Phone: ${phone}
Address: ${address}

Products:
`;


    let total=0;


    cart.forEach(item=>{

        const product=
            PRODUCTS.find(
                p=>p.id===item.id
            );


        const subtotal=
            product.price*
            item.qty;


        total+=subtotal;


        message+=
`• ${product.name}
  Qty: ${item.qty}
  Size: ${item.size}
  Colour: ${item.colour}
  Price: ₹${subtotal}

`;

    });


    message+=
`Total: ₹${total}

Please confirm my order.`;


    window.open(

        "https://wa.me/"+
        WHATSAPP_NUMBER+
        "?text="+
        encodeURIComponent(message),

        "_blank"

    );

}


/* =========================================================
   INITIAL PAGE
========================================================= */

window.addEventListener(
    "load",
    function(){

        if(
            !history.state ||
            !history.state.page
        ){

            history.replaceState(
                {page:"home"},
                "",
                "#home"
            );

        }


        render(
            history.state ||
            {page:"home"}
        );


        updateCartCount();

    }
);


/* =========================================================
   RENDER ROUTES
========================================================= */

function render(state){

    if(!state){

        renderHome();

        return;

    }


    switch(state.page){

        case "home":

            renderHome();

            break;


        case "category":

            renderCategory(
                state.type
            );

            break;


        case "product":

            renderProduct(
                state.id
            );

            break;


        case "cart":

            renderCart();

            break;


        case "checkout":

            renderCheckout();

            break;


        default:

            renderHome();

    }

}

</script>
