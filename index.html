<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RS 3D Custom Studio</title>

<style>
/* =========================
   GLOBAL
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:
        radial-gradient(circle at 20% 10%,rgba(255,105,0,.12),transparent 25%),
        radial-gradient(circle at 80% 80%,rgba(255,80,0,.08),transparent 25%),
        #050505;
    color:#fff;
    min-height:100vh;
    overflow-x:hidden;
}

button,
input,
textarea{
    font:inherit;
}

button{
    cursor:pointer;
}

a{
    text-decoration:none;
    color:inherit;
}

/* =========================
   SCROLLBAR
========================= */

::-webkit-scrollbar{
    width:8px;
}

::-webkit-scrollbar-track{
    background:#080808;
}

::-webkit-scrollbar-thumb{
    background:linear-gradient(#ff8a00,#ff3d00);
    border-radius:20px;
}

/* =========================
   HEADER
========================= */

header{
    position:sticky;
    top:0;
    z-index:1000;
    background:rgba(5,5,5,.82);
    backdrop-filter:blur(18px);
    border-bottom:1px solid rgba(255,102,0,.25);
    box-shadow:0 10px 40px rgba(0,0,0,.5);
}

.nav{
    max-width:1250px;
    margin:auto;
    min-height:75px;
    display:flex;
    align-items:center;
    gap:20px;
    padding:12px 20px;
}

.logo{
    font-size:23px;
    font-weight:900;
    white-space:nowrap;
    color:#fff;
    text-shadow:
        0 0 10px rgba(255,102,0,.5),
        0 0 30px rgba(255,102,0,.25);
}

.logo span{
    color:#ff6a00;
}

.search{
    flex:1;
    position:relative;
}

.search input{
    width:100%;
    background:#101010;
    color:white;
    border:1px solid #333;
    border-radius:14px;
    padding:13px 17px;
    outline:none;
    transition:.3s;
}

.search input:focus{
    border-color:#ff6500;
    box-shadow:0 0 20px rgba(255,101,0,.18);
}

.nav-buttons{
    display:flex;
    gap:8px;
}

.nav-btn{
    background:#111;
    color:#fff;
    border:1px solid #333;
    padding:11px 14px;
    border-radius:12px;
    transition:.25s;
}

.nav-btn:hover{
    border-color:#ff6500;
    transform:translateY(-2px);
    box-shadow:0 8px 20px rgba(255,90,0,.15);
}

.cart-count{
    color:#ff7100;
    font-weight:bold;
}

/* =========================
   MAIN
========================= */

main{
    max-width:1250px;
    margin:auto;
    padding:30px 20px 80px;
}

/* =========================
   3D HERO
========================= */

.hero{
    min-height:620px;
    position:relative;
    display:grid;
    grid-template-columns:1.1fr .9fr;
    align-items:center;
    gap:40px;
    overflow:hidden;
    border-radius:30px;
    padding:55px;
    background:
        linear-gradient(135deg,rgba(255,90,0,.13),transparent 45%),
        linear-gradient(315deg,rgba(255,50,0,.08),transparent 50%),
        #080808;
    border:1px solid rgba(255,100,0,.25);
    box-shadow:
        0 40px 100px rgba(0,0,0,.6),
        inset 0 0 60px rgba(255,90,0,.03);
    perspective:1000px;
}

.hero:before,
.hero:after{
    content:"";
    position:absolute;
    border-radius:50%;
    pointer-events:none;
}

.hero:before{
    width:400px;
    height:400px;
    right:-100px;
    top:-100px;
    border:1px solid rgba(255,100,0,.15);
    box-shadow:
        0 0 0 30px rgba(255,100,0,.03),
        0 0 0 60px rgba(255,100,0,.02);
    animation:spin 15s linear infinite;
}

.hero:after{
    width:180px;
    height:180px;
    left:-70px;
    bottom:-70px;
    border:1px solid rgba(255,120,0,.2);
}

@keyframes spin{
    from{transform:rotate(0deg)}
    to{transform:rotate(360deg)}
}

.hero-content{
    position:relative;
    z-index:3;
}

.badge{
    display:inline-block;
    border:1px solid rgba(255,100,0,.5);
    color:#ff8500;
    padding:8px 13px;
    border-radius:30px;
    margin-bottom:20px;
    background:rgba(255,80,0,.06);
    box-shadow:0 0 20px rgba(255,90,0,.08);
}

.hero h1{
    font-size:clamp(42px,6vw,78px);
    line-height:.98;
    margin-bottom:22px;
    letter-spacing:-3px;
}

.hero h1 span{
    color:#ff6500;
    text-shadow:
        0 0 10px rgba(255,100,0,.5),
        0 0 40px rgba(255,70,0,.2);
}

.hero p{
    color:#aaa;
    font-size:18px;
    line-height:1.7;
    max-width:620px;
}

.hero-buttons{
    display:flex;
    gap:12px;
    margin-top:30px;
    flex-wrap:wrap;
}

.primary-btn,
.secondary-btn{
    border:none;
    border-radius:14px;
    padding:15px 20px;
    font-weight:bold;
    transition:.3s;
}

.primary-btn{
    color:white;
    background:linear-gradient(135deg,#ff8a00,#ff3d00);
    box-shadow:
        0 10px 30px rgba(255,70,0,.25),
        inset 0 1px rgba(255,255,255,.25);
}

.primary-btn:hover{
    transform:translateY(-4px) scale(1.02);
    box-shadow:0 15px 40px rgba(255,70,0,.4);
}

.secondary-btn{
    color:white;
    background:#111;
    border:1px solid #333;
}

.secondary-btn:hover{
    border-color:#ff6500;
    transform:translateY(-3px);
}

/* =========================
   3D PRINTER OBJECT
========================= */

.hero-3d{
    height:430px;
    display:flex;
    align-items:center;
    justify-content:center;
    perspective:1000px;
    position:relative;
}

.printer-scene{
    width:280px;
    height:300px;
    position:relative;
    transform-style:preserve-3d;
    transform:rotateX(-8deg) rotateY(-20deg);
    animation:printerFloat 5s ease-in-out infinite;
}

@keyframes printerFloat{
    0%,100%{
        transform:rotateX(-8deg) rotateY(-20deg) translateY(0);
    }
    50%{
        transform:rotateX(-4deg) rotateY(-14deg) translateY(-15px);
    }
}

.printer-body{
    position:absolute;
    width:240px;
    height:210px;
    left:20px;
    top:45px;
    background:linear-gradient(135deg,#303030,#0e0e0e);
    border:2px solid #444;
    border-radius:18px;
    box-shadow:
        25px 25px 50px rgba(0,0,0,.7),
        inset 0 0 30px rgba(255,90,0,.06);
    transform-style:preserve-3d;
}

.printer-front{
    position:absolute;
    width:190px;
    height:145px;
    left:24px;
    top:30px;
    border:2px solid #555;
    background:#070707;
    border-radius:10px;
    transform:translateZ(18px);
    overflow:hidden;
}

.printer-front:after{
    content:"";
    position:absolute;
    width:100px;
    height:100px;
    border-radius:50%;
    border:2px solid rgba(255,100,0,.6);
    left:45px;
    top:20px;
    box-shadow:
        0 0 20px rgba(255,90,0,.25),
        inset 0 0 20px rgba(255,90,0,.1);
    animation:spin 8s linear infinite;
}

.printer-top{
    position:absolute;
    width:240px;
    height:45px;
    left:20px;
    top:25px;
    background:linear-gradient(135deg,#444,#171717);
    border-radius:15px;
    transform:translateZ(5px);
}

.printer-side{
    position:absolute;
    width:40px;
    height:210px;
    right:0;
    top:45px;
    background:#171717;
    transform:rotateY(90deg) translateZ(20px);
    transform-origin:right;
    border:1px solid #444;
}

.printer-base{
    position:absolute;
    width:260px;
    height:25px;
    left:10px;
    bottom:20px;
    border-radius:10px;
    background:linear-gradient(90deg,#222,#111,#222);
    box-shadow:0 15px 30px rgba(0,0,0,.6);
}

.nozzle{
    position:absolute;
    width:14px;
    height:35px;
    left:130px;
    top:82px;
    background:linear-gradient(#777,#222);
    z-index:5;
    transform:translateZ(25px);
}

.nozzle-tip{
    position:absolute;
    width:7px;
    height:7px;
    border-radius:50%;
    background:#ff6500;
    left:3px;
    bottom:-4px;
    box-shadow:0 0 15px #ff6500;
}

/* =========================
   SECTION
========================= */

.section-title{
    margin:65px 0 25px;
}

.section-title h2{
    font-size:34px;
    margin-bottom:8px;
}

.section-title p{
    color:#888;
}

/* =========================
   CATEGORY 3D CARDS
========================= */

.category-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:25px;
    perspective:1200px;
}

.category-card{
    min-height:280px;
    position:relative;
    overflow:hidden;
    border:1px solid #292929;
    border-radius:25px;
    padding:35px;
    background:
        linear-gradient(135deg,rgba(255,90,0,.13),transparent),
        #0b0b0b;
    transform-style:preserve-3d;
    transition:.35s;
    box-shadow:0 25px 60px rgba(0,0,0,.45);
}

.category-card:hover{
    transform:rotateX(4deg) rotateY(-5deg) translateY(-8px);
    border-color:#ff6500;
    box-shadow:
        20px 30px 70px rgba(0,0,0,.65),
        0 0 35px rgba(255,80,0,.12);
}

.category-icon{
    font-size:60px;
    margin-bottom:25px;
    transform:translateZ(40px);
}

.category-card h3{
    font-size:28px;
    margin-bottom:10px;
    transform:translateZ(35px);
}

.category-card p{
    color:#999;
    line-height:1.6;
    margin-bottom:25px;
    transform:translateZ(25px);
}

.category-card .primary-btn{
    transform:translateZ(35px);
}

/* =========================
   PRODUCTS
========================= */

.toolbar{
    display:flex;
    gap:12px;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
    flex-wrap:wrap;
}

.page-title h1{
    font-size:38px;
}

.page-title p{
    color:#888;
    margin-top:6px;
}

.product-search{
    width:280px;
}

.product-search input{
    width:100%;
    padding:13px;
    border-radius:12px;
    background:#111;
    border:1px solid #333;
    color:#fff;
    outline:none;
}

.product-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:20px;
    perspective:1200px;
}

.product-card{
    background:linear-gradient(145deg,#111,#080808);
    border:1px solid #292929;
    border-radius:18px;
    overflow:hidden;
    transition:.25s;
    transform-style:preserve-3d;
    box-shadow:0 15px 35px rgba(0,0,0,.35);
}

.product-card:hover{
    border-color:#ff6500;
    transform:translateY(-8px) rotateX(3deg) rotateY(-3deg);
    box-shadow:
        0 25px 50px rgba(0,0,0,.65),
        0 0 25px rgba(255,80,0,.1);
}

.product-image{
    height:210px;
    overflow:hidden;
    background:#151515;
}

.product-image img{
    width:100%;
    height:100%;
    object-fit:cover;
    transition:.5s;
}

.product-card:hover img{
    transform:scale(1.08);
}

.product-info{
    padding:17px;
}

.product-info h3{
    font-size:17px;
    margin-bottom:8px;
}

.product-info p{
    color:#888;
    font-size:13px;
    min-height:38px;
    line-height:1.45;
}

.price{
    color:#ff7500;
    font-size:21px;
    font-weight:bold;
    margin:14px 0;
}

.card-actions{
    display:flex;
    gap:8px;
}

.small-btn{
    flex:1;
    padding:10px;
    border-radius:10px;
    border:1px solid #333;
    background:#161616;
    color:white;
    transition:.2s;
}

.small-btn:hover{
    border-color:#ff6500;
}

.small-btn.primary{
    background:linear-gradient(135deg,#ff8000,#ff4300);
    border:none;
}

/* =========================
   PRODUCT DETAIL
========================= */

.product-detail{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:40px;
}

.gallery{
    position:sticky;
    top:100px;
}

.main-image{
    width:100%;
    height:500px;
    object-fit:cover;
    border-radius:22px;
    border:1px solid #333;
    background:#111;
    box-shadow:0 30px 70px rgba(0,0,0,.5);
}

.thumbs{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
    margin-top:12px;
}

.thumb{
    width:100%;
    height:90px;
    object-fit:cover;
    border-radius:10px;
    border:2px solid #252525;
    cursor:pointer;
    transition:.2s;
}

.thumb:hover,
.thumb.active{
    border-color:#ff6500;
}

.detail-content{
    padding-top:10px;
}

.detail-content h1{
    font-size:42px;
    line-height:1.05;
    margin-bottom:15px;
}

.detail-description{
    color:#aaa;
    line-height:1.7;
    font-size:16px;
}

.detail-price{
    color:#ff7200;
    font-size:32px;
    font-weight:bold;
    margin:25px 0;
}

.quantity-box{
    margin:20px 0;
}

.quantity-box label{
    display:block;
    margin-bottom:8px;
    color:#aaa;
}

.quantity-box input{
    width:100px;
    padding:13px;
    border-radius:10px;
    border:1px solid #444;
    background:#111;
    color:#fff;
    outline:none;
}

.detail-buttons{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

/* =========================
   CART
========================= */

.cart-list{
    display:flex;
    flex-direction:column;
    gap:15px;
}

.cart-item{
    display:grid;
    grid-template-columns:100px 1fr auto auto;
    gap:18px;
    align-items:center;
    background:#0d0d0d;
    border:1px solid #292929;
    border-radius:16px;
    padding:15px;
}

.cart-item img{
    width:100px;
    height:80px;
    object-fit:cover;
    border-radius:10px;
}

.cart-item h3{
    margin-bottom:5px;
}

.cart-item p{
    color:#888;
    font-size:13px;
}

.cart-price{
    color:#ff7200;
    font-weight:bold;
}

.remove-btn{
    border:1px solid #422;
    color:#ff6d6d;
    background:#170b0b;
    padding:9px 12px;
    border-radius:9px;
}

.cart-summary{
    margin-top:25px;
    padding:25px;
    border-radius:18px;
    background:#101010;
    border:1px solid #292929;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
    flex-wrap:wrap;
}

.total{
    font-size:28px;
    color:#ff7200;
    font-weight:bold;
}

/* =========================
   CHECKOUT
========================= */

.checkout{
    max-width:850px;
    margin:auto;
}

.checkout-form{
    display:grid;
    gap:15px;
    background:#0d0d0d;
    border:1px solid #292929;
    border-radius:20px;
    padding:25px;
}

.checkout-form label{
    color:#aaa;
    font-size:14px;
}

.checkout-form input,
.checkout-form textarea{
    width:100%;
    margin-top:7px;
    padding:14px;
    background:#111;
    color:white;
    border:1px solid #333;
    border-radius:10px;
    outline:none;
}

.checkout-form input:focus,
.checkout-form textarea:focus{
    border-color:#ff6500;
}

.checkout-form textarea{
    min-height:100px;
    resize:vertical;
}

/* =========================
   SEARCH RESULTS
========================= */

.no-results{
    text-align:center;
    padding:80px 20px;
    color:#777;
}

.no-results h2{
    color:white;
    margin-bottom:10px;
}

/* =========================
   EMPTY
========================= */

.empty{
    text-align:center;
    padding:100px 20px;
}

.empty-icon{
    font-size:65px;
    margin-bottom:20px;
}

.empty h2{
    margin-bottom:10px;
}

.empty p{
    color:#888;
    margin-bottom:25px;
}

/* =========================
   WHATSAPP
========================= */

.whatsapp{
    position:fixed;
    right:20px;
    bottom:20px;
    width:58px;
    height:58px;
    border-radius:50%;
    background:#25D366;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:28px;
    z-index:999;
    box-shadow:0 10px 30px rgba(37,211,102,.3);
    transition:.25s;
}

.whatsapp:hover{
    transform:scale(1.1);
}

/* =========================
   FOOTER
========================= */

footer{
    border-top:1px solid #222;
    background:#050505;
    padding:35px 20px;
    text-align:center;
    color:#777;
}

footer strong{
    color:#ff7000;
}

/* =========================
   BACK BUTTON
========================= */

.back-btn{
    margin-bottom:25px;
    background:#111;
    color:#fff;
    border:1px solid #333;
    border-radius:10px;
    padding:10px 15px;
}

.back-btn:hover{
    border-color:#ff6500;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:1000px){

    .product-grid{
        grid-template-columns:repeat(3,1fr);
    }

    .hero{
        grid-template-columns:1fr;
        padding:40px;
    }

    .hero-3d{
        height:350px;
    }

}

@media(max-width:750px){

    .nav{
        flex-wrap:wrap;
    }

    .logo{
        width:100%;
        text-align:center;
    }

    .search{
        order:3;
        flex-basis:100%;
    }

    .nav-buttons{
        margin:auto;
    }

    .hero{
        min-height:auto;
        padding:30px 20px;
        border-radius:20px;
    }

    .hero h1{
        letter-spacing:-2px;
    }

    .category-grid{
        grid-template-columns:1fr;
    }

    .product-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .product-detail{
        grid-template-columns:1fr;
    }

    .gallery{
        position:static;
    }

    .main-image{
        height:380px;
    }

    .cart-item{
        grid-template-columns:80px 1fr;
    }

    .cart-item img{
        width:80px;
        height:70px;
    }

    .cart-price,
    .remove-btn{
        grid-column:2;
    }
}

@media(max-width:500px){

    main{
        padding:20px 12px 70px;
    }

    .hero{
        padding:25px 18px;
    }

    .hero h1{
        font-size:43px;
    }

    .hero p{
        font-size:15px;
    }

    .hero-3d{
        height:280px;
        transform:scale(.8);
    }

    .product-grid{
        grid-template-columns:1fr;
    }

    .product-image{
        height:240px;
    }

    .main-image{
        height:300px;
    }

    .detail-content h1{
        font-size:32px;
    }

    .toolbar{
        align-items:stretch;
    }

    .product-search{
        width:100%;
    }

    .nav-btn{
        padding:9px 11px;
        font-size:13px;
    }
}
</style>
</head>

<body>

<header>
    <div class="nav">

        <div class="logo">
            RS <span>3D</span> Custom Studio
        </div>

        <div class="search">
            <input
                type="text"
                id="globalSearch"
                placeholder="Search products..."
                oninput="globalSearch(this.value)"
            >
        </div>

        <div class="nav-buttons">
            <button class="nav-btn" onclick="goHome()">Home</button>
            <button class="nav-btn" onclick="goCart()">
                🛒 Cart <span class="cart-count" id="cartCount">0</span>
            </button>
        </div>

    </div>
</header>

<main id="app"></main>

<a
    class="whatsapp"
    href="https://wa.me/917708859615"
    target="_blank"
    title="WhatsApp"
>
    💬
</a>

<footer>
    <p>
        © 2026 <strong>RS 3D Custom Studio</strong>
    </p>
    <p style="margin-top:8px">
        3D Printing • Customized Art • Craft • Gifts
    </p>
</footer>

/* =========================================================
   CART
========================================================= */

let cart = JSON.parse(localStorage.getItem("rs3d_cart")) || [];


/* =========================================================
   UTILITIES
========================================================= */

function saveCart(){
    localStorage.setItem("rs3d_cart",JSON.stringify(cart));
    updateCartCount();
}

function updateCartCount(){

    const count = cart.reduce(
        (sum,item)=>sum + item.quantity,
        0
    );

    const el = document.getElementById("cartCount");

    if(el){
        el.textContent=count;
    }
}

function money(value){
    return "₹" + Number(value).toLocaleString("en-IN");
}

function escapeHTML(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


/* =========================================================
   HISTORY / NAVIGATION
========================================================= */

function navigate(state){

    let hash="#home";

    if(state.page==="category"){
        hash="#"+state.type;
    }

    if(state.page==="product"){
        hash="#product-"+state.id;
    }

    if(state.page==="cart"){
        hash="#cart";
    }

    if(state.page==="checkout"){
        hash="#checkout";
    }

    history.pushState(state,"",hash);

    render(state);
}

function goHome(){
    navigate({
        page:"home"
    });
}

function goCategory(type){
    navigate({
        page:"category",
        type:type
    });
}

function goProduct(id){
    navigate({
        page:"product",
        id:Number(id)
    });
}

function goCart(){
    navigate({
        page:"cart"
    });
}

function goCheckout(){
    navigate({
        page:"checkout"
    });
}

window.addEventListener(
    "popstate",
    function(event){

        render(
            event.state || {
                page:"home"
            }
        );

    }
);

                src="${product.images[0]}"
                alt="${escapeHTML(product.name)}"

            <h3>
                ${escapeHTML(product.name)}
            </h3>

            <p>

            </p>

                ${money(product.price)}

                <button
                    class="small-btn"
                    onclick="goProduct(${product.id})"
                >

function renderCategory(type){

    const isPrinting = type==="printing";

    const products = PRODUCTS.filter(
        p=>p.type===type
    );

    return `

    <button
        class="back-btn"
        onclick="goHome()"
    >
        ← Back to Home
    </button>


    <div class="toolbar">

        <div class="page-title">

            <h1>
                ${isPrinting
                    ? "🖨️ 3D Printing"
                    : "🎨 Customized Art, Craft & Gifts"
                }

            <p>
                ${isPrinting
                    ? "Custom 3D printed products."
                    : "Personalized gifts and creative products."
                }
            </p>

        </div>

        <div class="product-search">

            <input
                type="text"
                placeholder="Search this category..."
                oninput="categorySearch('${type}',this.value)"
            >

        </div>

    </div>


    <div
        id="categoryProducts"
        class="product-grid"
    >

        ${products.map(productCard).join("")}

    </div>
    `;
}


function categorySearch(type,value){

    const q=value.trim().toLowerCase();

    const products = PRODUCTS.filter(product=>{

        if(product.type!==type){
            return false;
        }

        return (
            product.name.toLowerCase().includes(q) ||
            product.description.toLowerCase().includes(q)
        );

    });

    const container =
        document.getElementById("categoryProducts");

    if(!container){
        return;
    }

    if(products.length===0){

        container.innerHTML=`

            <div class="no-results"
                 style="grid-column:1/-1">

                <h2>No products found</h2>

                <p>
                    Try another search.
                </p>

            </div>

        `;

        return;
    }

    container.innerHTML=
        products.map(productCard).join("");
}

                <button
                    class="primary-btn"
                    onclick="goHome()"

        `;
    }

    return `

        ← Back
    </button>


    <section class="product-detail">


        <div class="gallery">

            <img
                id="mainProductImage"

                >

            </div>


            <div class="detail-buttons">

                <button
                    class="primary-btn"
                    onclick="addCurrentProductToCart(${product.id})"
                >

function changeMainImage(element,image){

    const main =
        document.getElementById(
            "mainProductImage"
        );

    if(main){
        main.src=image;
    }

    document
        .querySelectorAll(".thumb")
        .forEach(
            img=>img.classList.remove("active")
        );

    element.classList.add("active");
}


/* =========================================================
   CART FUNCTIONS
========================================================= */

function addToCart(id,quantity){

    const product =
        PRODUCTS.find(
            p=>p.id===Number(id)
        );

    if(!product){
        return;
    }

    quantity =
        Math.max(
            1,
            Number(quantity)||1
        );


    const existing =
        cart.find(
            item=>item.id===product.id
        );


    if(existing){

        existing.quantity += quantity;

    }else{

        cart.push({
            id:product.id,
            quantity:quantity
        });

    }

    saveCart();

    alert(
        product.name +
        " added to cart!"
    );
}


function addCurrentProductToCart(id){

    const input =
        document.getElementById("quantity");

    const quantity =
        input
        ? Math.max(
            1,
            Number(input.value)||1
        )
        : 1;

    addToCart(id,quantity);
}


function quickWhatsApp(id){

    const product =
        PRODUCTS.find(
            p=>p.id===Number(id)
        );

    if(!product){
        return;
    }

    const quantityInput =
        document.getElementById("quantity");

    const quantity =
        quantityInput
        ? Math.max(
            1,
            Number(quantityInput.value)||1
        )
        : 1;

    const total =
        product.price * quantity;


    const message =
`Hello RS 3D Custom Studio 👋

I want to order:

Product: ${product.name}

Quantity: ${quantity}

Price per item: ₹${product.price}

Total: ₹${total}

Please confirm my order.`;


    window.open(
        "https://wa.me/917708859615?text="+
        encodeURIComponent(message),
        "_blank"
    );
}


/* =========================================================
   CART PAGE
========================================================= */

function renderCart(){

                🛒
            </div>

                Your cart is empty

        onclick="goHome()"

            🛒 Your Cart
        </h2>

    </div>

    <div class="cart-summary">

            <p style="color:#888">
                Grand Total

        </div>


        <button

function removeFromCart(id){

    cart =
        cart.filter(
            item=>item.id!==Number(id)
        );

    saveCart();

    render({
        page:"cart"
    });
}

function sendOrderWhatsApp(){

        document.getElementById(
            "customerName"
        ).value.trim();

        document.getElementById(
            "customerPhone"
        ).value.trim();

    const address =
        document.getElementById(

        ).value.trim();

    if(!name){

    if(!phone){

    }


    if(!address){

        alert("Please enter your address.");

        return;
    }


    let grandTotal=0;


    let productText="";


    cart.forEach(item=>{

        const product =
            PRODUCTS.find(
                p=>p.id===item.id
            );

        if(!product){
            return;
        }

        const itemTotal =
            product.price *
            item.quantity;

        grandTotal += itemTotal;


        productText +=
`
Product: ${product.name}
Quantity: ${item.quantity}
Price per item: ₹${product.price}
Total: ₹${itemTotal}
`;
    });


    const message =
`Hello RS 3D Custom Studio 👋

I want to place an order.

CUSTOMER DETAILS

Name: ${name}

Phone: ${phone}

Address:
${address}


ORDER DETAILS

${productText}

GRAND TOTAL:
₹${grandTotal}

Additional Notes:
${notes || "None"}

Please confirm my order. Thank you!`;


    window.open(
        "https://wa.me/917708859615?text="+
        encodeURIComponent(message),
        "_blank"
    );
}


/* =========================================================
   GLOBAL SEARCH
========================================================= */

function globalSearch(value){

    const q =
        value.trim().toLowerCase();


    if(q===""){

        render(
            history.state ||
            {
                page:"home"
            }
        );

        return;
    }


    const results =
        PRODUCTS.filter(product=>{

            const name =
                product.name.toLowerCase();

            const description =
                product.description.toLowerCase();

            const type =
                product.type.toLowerCase();

            const categoryText =
                type==="printing"
                ? "3d printing print"
                : "craft art gifts customized";


            return (
                name.includes(q) ||
                description.includes(q) ||
                categoryText.includes(q)
            );

        });


    renderSearchResults(
        value,
        results
    );
}


function renderSearchResults(
    query,
    results
){

    const app =
        document.getElementById("app");


    if(results.length===0){

        app.innerHTML=`

        <div class="no-results">

            <h2>
                No products found
            </h2>

            <p>
                No result for "${escapeHTML(query)}"
            </p>

            <button
                class="primary-btn"
                style="margin-top:20px"
                onclick="goHome()"
            >
                Back Home
            </button>

        </div>

        `;

        return;
    }


    app.innerHTML=`

    <button
        class="back-btn"
        onclick="goHome()"
    >
        ← Home
    </button>


    <div class="section-title">

        <h2>
            Search Results
        </h2>

        <p>
            Results for:
            "${escapeHTML(query)}"
        </p>

    </div>


    <div class="product-grid">

        ${results.map(productCard).join("")}

    </div>

    `;
}


/* =========================================================
   RENDER
========================================================= */

function render(state){

    const app =
        document.getElementById("app");


    if(!state || !state.page){

        state={
            page:"home"
        };

    }


    if(state.page==="home"){

        app.innerHTML =
            renderHome();

    }


    else if(state.page==="category"){

        app.innerHTML =
            renderCategory(state.type);

    }


    else if(state.page==="product"){

        app.innerHTML =
            renderProduct(state.id);

    }


    else if(state.page==="cart"){

        app.innerHTML =
            renderCart();

    }


    else if(state.page==="checkout"){

        app.innerHTML =
            renderCheckout();

    }


    updateCartCount();

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
}


/* =========================================================
   INITIAL LOAD
========================================================= */

function loadInitialPage(){

    const hash =
        window.location.hash;


    if(hash.startsWith("#product-")){

        const id =
            Number(
                hash.replace("#product-","")
            );

        history.replaceState(
            {
                page:"product",
                id:id
            },
            "",
            hash
        );

        render({
            page:"product",
            id:id
        });

        return;
    }


    if(hash==="#printing"){

        history.replaceState(
            {
                page:"category",
                type:"printing"
            },
            "",
            hash
        );

        render({
            page:"category",
            type:"printing"
        });

        return;
    }


    if(hash==="#craft"){

        history.replaceState(
            {
                page:"category",
                type:"craft"
            },
            "",
            hash
        );

        render({
            page:"category",
            type:"craft"
        });

        return;
    }


    if(hash==="#cart"){

        history.replaceState(
            {
                page:"cart"
            },
            "",
            hash
        );

        render({
            page:"cart"
        });

        return;
    }


    if(hash==="#checkout"){

        history.replaceState(
            {
                page:"checkout"
            },
            "",
            hash
        );

        render({
            page:"checkout"
        });

        return;
    }


    history.replaceState(
        {
            page:"home"
        },
        "",
        "#home"
    );

    render({
        page:"home"
    });
}


loadInitialPage();

</script>
