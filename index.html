<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RS 3D Custom Studio</title>

<meta name="description"
content="RS 3D Custom Studio - 3D Printing, Customized Art, Craft and Gifts">

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#ffffff;
    color:#171717;
    overflow-x:hidden;
}

:root{
    --orange:#ff6500;
    --orange2:#ff9b4a;
    --silver:#dfe3e7;
    --silver2:#f5f6f7;
    --dark:#191919;
    --gray:#666;
    --border:#e4e4e4;
    --shadow:0 15px 40px rgba(0,0,0,.10);
}

button,
input,
textarea{
    font-family:inherit;
}

button{
    cursor:pointer;
}

a{
    text-decoration:none;
    color:inherit;
}

/* =========================
   HEADER
========================= */

header{
    position:sticky;
    top:0;
    z-index:1000;
    background:rgba(255,255,255,.94);
    backdrop-filter:blur(15px);
    border-bottom:1px solid #eee;
}

.navbar{
    max-width:1250px;
    margin:auto;
    min-height:75px;
    padding:12px 20px;

    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
    cursor:pointer;
    min-width:max-content;
}

.logo-icon{
    width:46px;
    height:46px;
    border-radius:13px;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:25px;

    background:
    linear-gradient(145deg,#ffffff,#dfe2e5);

    border:2px solid var(--orange);

    box-shadow:
    inset 2px 2px 5px white,
    inset -3px -3px 7px #bbb,
    0 5px 15px rgba(255,101,0,.18);
}

.logo-text{
    font-size:20px;
    font-weight:900;
    letter-spacing:-.5px;
}

.logo-text span{
    color:var(--orange);
}

.nav-actions{
    display:flex;
    align-items:center;
    gap:10px;
}

.search{
    width:230px;
    height:42px;
    border:1px solid #ddd;
    border-radius:12px;
    padding:0 14px;
    outline:none;
    background:#fff;
}

.search:focus{
    border-color:var(--orange);
    box-shadow:0 0 0 3px rgba(255,101,0,.1);
}

.nav-btn{
    border:1px solid #ddd;
    background:white;
    padding:11px 15px;
    border-radius:11px;
    font-weight:700;
}

.nav-btn:hover{
    border-color:var(--orange);
    color:var(--orange);
}

.cart-btn{
    position:relative;
    background:var(--dark);
    color:white;
    border:none;
}

.cart-count{
    position:absolute;
    top:-8px;
    right:-7px;

    width:22px;
    height:22px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;

    background:var(--orange);
    color:white;

    font-size:11px;
    font-weight:bold;
}

/* =========================
   MAIN
========================= */

#app{
    min-height:70vh;
}

.container{
    max-width:1250px;
    margin:auto;
    padding:0 20px;
}

/* =========================
   HERO
========================= */

.hero{
    min-height:650px;

    display:grid;
    grid-template-columns:1fr 1fr;
    align-items:center;

    max-width:1250px;
    margin:auto;

    padding:55px 20px;
}

.hero-content{
    position:relative;
    z-index:2;
}

.badge{
    display:inline-block;

    padding:8px 14px;
    border-radius:30px;

    background:#fff3eb;
    color:var(--orange);

    border:1px solid #ffd3ba;

    font-size:13px;
    font-weight:800;

    margin-bottom:18px;
}

.hero h1{
    font-size:clamp(42px,6vw,76px);
    line-height:.95;
    letter-spacing:-4px;
    margin-bottom:25px;
}

.hero h1 span{
    color:var(--orange);
}

.hero p{
    max-width:560px;
    color:#606060;
    font-size:18px;
    line-height:1.7;
    margin-bottom:30px;
}

.hero-buttons{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
}

.primary-btn{
    border:none;
    background:linear-gradient(145deg,#ff7a22,#ed5600);
    color:white;

    padding:14px 21px;
    border-radius:12px;

    font-weight:800;

    box-shadow:
    0 10px 25px rgba(255,101,0,.25),
    inset 0 1px 0 rgba(255,255,255,.4);

    transition:.25s;
}

.primary-btn:hover{
    transform:translateY(-3px);
    box-shadow:
    0 16px 30px rgba(255,101,0,.3);
}

.secondary-btn{
    border:1px solid #ddd;
    background:#fff;
    color:#222;

    padding:14px 21px;
    border-radius:12px;

    font-weight:800;
}

.secondary-btn:hover{
    border-color:var(--orange);
    color:var(--orange);
}

/* =========================
   REAL 3D SCENE
========================= */

.scene-area{
    position:relative;
    height:560px;

    perspective:1200px;
}

#sceneWrap{
    position:absolute;
    inset:0;

    border-radius:30px;

    background:
    radial-gradient(
        circle at 50% 45%,
        #ffffff 0%,
        #f5f5f5 55%,
        #e8e8e8 100%
    );

    border:1px solid #e5e5e5;

    box-shadow:
    inset 0 0 80px rgba(0,0,0,.05),
    0 25px 70px rgba(0,0,0,.12);

    overflow:hidden;
}

#scene{
    width:100%;
    height:100%;
    display:block;
}

.scene-label{
    position:absolute;
    left:20px;
    top:20px;

    padding:10px 14px;

    background:rgba(255,255,255,.88);
    backdrop-filter:blur(10px);

    border:1px solid #ddd;
    border-radius:12px;

    font-size:13px;
    font-weight:800;
}

.scene-hint{
    position:absolute;
    bottom:18px;
    left:50%;
    transform:translateX(-50%);

    padding:8px 13px;

    background:rgba(255,255,255,.9);
    border-radius:20px;

    font-size:12px;
    color:#666;

    white-space:nowrap;
}

/* =========================
   CATEGORY SELECTOR
========================= */

.category-section{
    max-width:1250px;
    margin:auto;
    padding:30px 20px 70px;
}

.section-title{
    text-align:center;
    margin-bottom:35px;
}

.section-title h2{
    font-size:38px;
    margin-bottom:10px;
}

.section-title p{
    color:#777;
}

.category-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:25px;
}

.category-card{
    min-height:260px;

    border-radius:25px;
    padding:35px;

    position:relative;
    overflow:hidden;

    background:
    linear-gradient(
        145deg,
        #ffffff,
        #f1f2f3
    );

    border:1px solid #ddd;

    box-shadow:var(--shadow);

    transition:.35s;

    transform-style:preserve-3d;
}

.category-card:hover{
    transform:
    perspective(1000px)
    rotateX(3deg)
    rotateY(-3deg)
    translateY(-7px);
}

.category-card::before{
    content:"";

    position:absolute;

    width:250px;
    height:250px;

    right:-90px;
    top:-90px;

    border-radius:50%;

    background:
    radial-gradient(
        circle,
        rgba(255,101,0,.25),
        transparent 65%
    );
}

.category-icon{
    font-size:55px;
    margin-bottom:20px;
}

.category-card h3{
    font-size:30px;
    margin-bottom:10px;
}

.category-card p{
    color:#666;
    line-height:1.6;
    margin-bottom:22px;
}

/* =========================
   PRODUCTS
========================= */

.page-head{
    max-width:1250px;
    margin:auto;
    padding:55px 20px 25px;
}

.page-head h1{
    font-size:45px;
    margin-bottom:10px;
}

.page-head p{
    color:#666;
}

.filter-bar{
    max-width:1250px;
    margin:auto;
    padding:10px 20px 30px;

    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
}

.filter-buttons{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
}

.filter-btn{
    padding:9px 13px;

    border-radius:10px;

    border:1px solid #ddd;
    background:#fff;
}

.filter-btn.active{
    background:var(--orange);
    color:white;
    border-color:var(--orange);
}

.products-grid{
    max-width:1250px;
    margin:auto;
    padding:10px 20px 70px;

    display:grid;
    grid-template-columns:
    repeat(4,1fr);

    gap:22px;
}

.product-card{
    background:#fff;

    border:1px solid #e2e2e2;
    border-radius:20px;

    overflow:hidden;

    box-shadow:
    0 8px 25px rgba(0,0,0,.07);

    transition:.3s;

    transform-style:preserve-3d;
}

.product-card:hover{
    transform:
    perspective(900px)
    rotateX(2deg)
    rotateY(-3deg)
    translateY(-8px);

    box-shadow:
    0 20px 45px rgba(0,0,0,.14);
}

.product-image{
    height:210px;

    background:
    linear-gradient(
        145deg,
        #f7f7f7,
        #e8e8e8
    );

    overflow:hidden;
    cursor:pointer;
}

.product-image img{
    width:100%;
    height:100%;
    object-fit:cover;

    transition:.4s;
}

.product-card:hover .product-image img{
    transform:scale(1.06);
}

.product-info{
    padding:17px;
}

.product-category{
    color:var(--orange);
    font-size:11px;
    font-weight:800;
    text-transform:uppercase;

    margin-bottom:7px;
}

.product-info h3{
    font-size:17px;
    margin-bottom:8px;
}

.product-description{
    color:#777;
    font-size:13px;
    line-height:1.5;

    min-height:39px;
}

.price{
    font-size:21px;
    font-weight:900;

    margin:15px 0;
}

.product-actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
}

.small-btn{
    padding:10px 8px;
    border-radius:9px;

    border:1px solid #ddd;
    background:#fff;

    font-weight:700;
    font-size:12px;
}

.small-btn:hover{
    border-color:var(--orange);
    color:var(--orange);
}

.small-btn.orange{
    background:var(--orange);
    color:white;
    border-color:var(--orange);
}

/* =========================
   PRODUCT DETAIL
========================= */

.product-detail{
    max-width:1250px;
    margin:auto;

    padding:55px 20px 80px;

    display:grid;
    grid-template-columns:1fr 1fr;
    gap:45px;
}

.gallery{
    display:grid;
    grid-template-columns:100px 1fr;
    gap:12px;
}

.thumbnails{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.thumb{
    width:90px;
    height:75px;

    border:1px solid #ddd;
    border-radius:10px;

    overflow:hidden;
    cursor:pointer;
}

.thumb.active{
    border:2px solid var(--orange);
}

.thumb img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.main-photo{
    height:500px;

    border-radius:20px;

    overflow:hidden;

    background:#f1f1f1;
    border:1px solid #ddd;
}

.main-photo img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.detail-info h1{
    font-size:43px;
    margin-bottom:15px;
}

.detail-price{
    font-size:30px;
    font-weight:900;
    color:var(--orange);

    margin:20px 0;
}

.detail-description{
    color:#666;
    line-height:1.7;

    margin-bottom:25px;
}

.detail-box{
    padding:18px;

    border-radius:15px;

    background:#f7f7f7;
    border:1px solid #e4e4e4;

    margin-bottom:20px;
}

.detail-box strong{
    display:block;
    margin-bottom:8px;
}

.quantity-box{
    margin:20px 0;
}

.quantity-box label{
    display:block;
    font-weight:800;
    margin-bottom:8px;
}

.quantity-box input{
    width:100px;
    height:45px;

    border:1px solid #ccc;
    border-radius:10px;

    padding:10px;
    font-size:17px;
}

.detail-buttons{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

/* =========================
   CART
========================= */

.cart-page{
    max-width:1000px;
    margin:auto;

    padding:55px 20px 80px;
}

.cart-page h1{
    font-size:40px;
    margin-bottom:25px;
}

.cart-item{
    display:grid;
    grid-template-columns:100px 1fr auto;

    align-items:center;
    gap:18px;

    padding:18px 0;

    border-bottom:1px solid #eee;
}

.cart-item-image{
    width:100px;
    height:80px;

    border-radius:12px;
    overflow:hidden;

    background:#eee;
}

.cart-item-image img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.cart-item h3{
    margin-bottom:6px;
}

.cart-item p{
    color:#777;
    font-size:13px;
}

.cart-qty{
    display:flex;
    align-items:center;
    gap:8px;

    margin-top:8px;
}

.cart-qty button{
    width:28px;
    height:28px;

    border:1px solid #ddd;
    background:white;
    border-radius:6px;
}

.cart-total{
    text-align:right;

    margin-top:30px;

    padding:25px;

    background:#f7f7f7;
    border-radius:15px;
}

.cart-total h2{
    margin-bottom:20px;
}

/* =========================
   CHECKOUT
========================= */

.checkout{
    max-width:900px;
    margin:auto;

    padding:55px 20px 80px;
}

.checkout h1{
    font-size:40px;
    margin-bottom:30px;
}

.form-group{
    margin-bottom:18px;
}

.form-group label{
    display:block;
    font-weight:800;
    margin-bottom:7px;
}

.form-group input,
.form-group textarea{
    width:100%;

    padding:13px;

    border:1px solid #ccc;
    border-radius:10px;

    outline:none;
}

.form-group textarea{
    min-height:100px;
    resize:vertical;
}

.order-summary{
    margin-top:30px;

    padding:20px;

    border-radius:15px;

    background:#f7f7f7;
}

/* =========================
   EMPTY
========================= */

.empty{
    text-align:center;
    padding:90px 20px;
}

.empty h2{
    margin-bottom:12px;
}

.empty p{
    color:#777;
    margin-bottom:25px;
}

/* =========================
   FOOTER
========================= */

footer{
    background:#fafafa;
    border-top:1px solid #eee;

    padding:45px 20px;
}

.footer-inner{
    max-width:1250px;
    margin:auto;

    display:grid;
    grid-template-columns:2fr 1fr 1fr;
    gap:30px;
}

.footer-brand h2{
    margin-bottom:10px;
}

.footer-brand span{
    color:var(--orange);
}

footer p{
    color:#777;
    line-height:1.6;
}

footer h3{
    margin-bottom:12px;
}

.footer-link{
    display:block;
    margin-bottom:8px;
    color:#666;
    cursor:pointer;
}

.footer-link:hover{
    color:var(--orange);
}

/* =========================
   WHATSAPP
========================= */

.whatsapp{
    position:fixed;

    right:20px;
    bottom:20px;

    width:58px;
    height:58px;

    border-radius:50%;

    background:#25D366;
    color:white;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:28px;

    z-index:999;

    box-shadow:
    0 10px 25px rgba(0,0,0,.2);

    transition:.25s;
}

.whatsapp:hover{
    transform:scale(1.08);
}

/* =========================
   TOAST
========================= */

.toast{
    position:fixed;

    left:50%;
    bottom:30px;

    transform:
    translateX(-50%)
    translateY(100px);

    padding:13px 20px;

    background:#191919;
    color:white;

    border-radius:10px;

    z-index:2000;

    opacity:0;

    transition:.3s;
}

.toast.show{
    transform:
    translateX(-50%)
    translateY(0);

    opacity:1;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:1000px){

    .products-grid{
        grid-template-columns:
        repeat(3,1fr);
    }

    .hero{
        grid-template-columns:1fr;
    }

    .scene-area{
        height:480px;
    }

}

@media(max-width:750px){

    .navbar{
        flex-wrap:wrap;
    }

    .nav-actions{
        width:100%;
    }

    .search{
        flex:1;
        width:auto;
    }

    .nav-btn{
        padding:10px;
    }

    .hero{
        padding-top:35px;
    }

    .hero h1{
        letter-spacing:-2px;
    }

    .scene-area{
        height:400px;
    }

    .category-grid{
        grid-template-columns:1fr;
    }

    .products-grid{
        grid-template-columns:
        repeat(2,1fr);

        gap:13px;
    }

    .product-image{
        height:170px;
    }

    .product-info{
        padding:12px;
    }

    .product-actions{
        grid-template-columns:1fr;
    }

    .product-detail{
        grid-template-columns:1fr;
        gap:25px;
    }

    .gallery{
        grid-template-columns:75px 1fr;
    }

    .thumb{
        width:68px;
        height:60px;
    }

    .main-photo{
        height:380px;
    }

    .detail-info h1{
        font-size:32px;
    }

    .footer-inner{
        grid-template-columns:1fr;
    }

}

@media(max-width:480px){

    .navbar{
        padding:10px;
    }

    .logo-text{
        font-size:16px;
    }

    .logo-icon{
        width:40px;
        height:40px;
    }

    .nav-btn{
        font-size:12px;
    }

    .hero{
        padding-left:15px;
        padding-right:15px;
    }

    .hero p{
        font-size:15px;
    }

    .scene-area{
        height:330px;
    }

    .products-grid{
        grid-template-columns:1fr 1fr;
    }

    .product-image{
        height:145px;
    }

    .product-info h3{
        font-size:14px;
    }

    .price{
        font-size:18px;
    }

    .small-btn{
        font-size:11px;
    }

}

</style>
</head>

<script type="module">

import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';


/* ==================================
   THREE.JS GLOBALS
================================== */

let scene;
let camera;
let renderer;

let printerGroup;
let printHead;

let isDragging=false;
let previousX=0;
let previousY=0;

let targetRotationY=0;
let targetRotationX=0;


/* ==================================
   CREATE 3D PRINTER
================================== */

function create3DPrinter(){

    const canvas =
        document.getElementById("scene");

    if(!canvas) return;


    scene =
        new THREE.Scene();

    scene.background =
        new THREE.Color(0xf7f7f7);


    camera =
        new THREE.PerspectiveCamera(
            42,
            canvas.clientWidth /
            canvas.clientHeight,
            .1,
            100
        );

    camera.position.set(
        7,
        5,
        9
    );


    renderer =
        new THREE.WebGLRenderer({
            canvas:canvas,
            antialias:true,
            alpha:true
        });

    renderer.setPixelRatio(
        Math.min(window.devicePixelRatio,2)
    );

    renderer.setSize(
        canvas.clientWidth,
        canvas.clientHeight
    );

    renderer.shadowMap.enabled=true;

    renderer.shadowMap.type =
        THREE.PCFSoftShadowMap;


    /* =========================
       LIGHTS
    ========================= */

    const ambient =
        new THREE.HemisphereLight(
            0xffffff,
            0xbfc4c9,
            2.5
        );

    scene.add(ambient);


    const keyLight =
        new THREE.DirectionalLight(
            0xffffff,
            4
        );

    keyLight.position.set(
        5,
        10,
        5
    );

    keyLight.castShadow=true;

    scene.add(keyLight);


    const orangeLight =
        new THREE.PointLight(
            0xff6500,
            5,
            15
        );

    orangeLight.position.set(
        -5,
        3,
        3
    );

    scene.add(orangeLight);


    /* =========================
       MATERIALS
    ========================= */

    const orangeMaterial =
        new THREE.MeshStandardMaterial({

            color:0xff6500,

            metalness:.8,

            roughness:.22
        });


    const silverMaterial =
        new THREE.MeshStandardMaterial({

            color:0xdfe3e7,

            metalness:.95,

            roughness:.18
        });


    const darkMaterial =
        new THREE.MeshStandardMaterial({

            color:0x222222,

            metalness:.65,

            roughness:.25
        });


    const whiteMaterial =
        new THREE.MeshStandardMaterial({

            color:0xffffff,

            metalness:.2,

            roughness:.3
        });


    /* =========================
       PRINTER GROUP
    ========================= */

    printerGroup =
        new THREE.Group();

    scene.add(printerGroup);


    /* =========================
       BASE
    ========================= */

    const baseGeometry =
        new THREE.BoxGeometry(
            5.8,
            .65,
            4.3
        );

    const base =
        new THREE.Mesh(
            baseGeometry,
            darkMaterial
        );

    base.position.y=-2;

    base.castShadow=true;
    base.receiveShadow=true;

    printerGroup.add(base);


    /* =========================
       PRINT BED
    ========================= */

    const bedGeometry =
        new THREE.BoxGeometry(
            4.8,
            .18,
            3.3
        );

    const bed =
        new THREE.Mesh(
            bedGeometry,
            silverMaterial
        );

    bed.position.y=-1.58;

    bed.castShadow=true;

    printerGroup.add(bed);


    /* =========================
       FOUR VERTICAL POSTS
    ========================= */

    const postGeometry =
        new THREE.BoxGeometry(
            .28,
            6,
            .28
        );


    const postPositions=[
        [-2.55,1, -1.75],
        [ 2.55,1, -1.75],
        [-2.55,1,  1.75],
        [ 2.55,1,  1.75]
    ];


    postPositions.forEach(
        position=>{

            const post =
                new THREE.Mesh(
                    postGeometry,
                    orangeMaterial
                );

            post.position.set(
                position[0],
                position[1],
                position[2]
            );

            post.castShadow=true;

            printerGroup.add(post);

        }
    );


    /* =========================
       TOP FRAME
    ========================= */

    const topGeometry =
        new THREE.BoxGeometry(
            5.8,
            .35,
            3.9
        );

    const top =
        new THREE.Mesh(
            topGeometry,
            silverMaterial
        );

    top.position.y=4;

    top.castShadow=true;

    printerGroup.add(top);


    /* =========================
       TOP ORANGE RAIL
    ========================= */

    const railGeometry =
        new THREE.BoxGeometry(
            4.7,
            .22,
            .28
        );

    const rail =
        new THREE.Mesh(
            railGeometry,
            orangeMaterial
        );

    rail.position.set(
        0,
        3.55,
        0
    );

    printerGroup.add(rail);


    /* =========================
       PRINT HEAD
    ========================= */

    printHead =
        new THREE.Group();


    const headBodyGeometry =
        new THREE.BoxGeometry(
            1.05,
            .65,
            .8
        );


    const headBody =
        new THREE.Mesh(
            headBodyGeometry,
            darkMaterial
        );

    headBody.castShadow=true;

    printHead.add(headBody);


    const nozzleGeometry =
        new THREE.ConeGeometry(
            .16,
            .5,
            20
        );


    const nozzle =
        new THREE.Mesh(
            nozzleGeometry,
            orangeMaterial
        );

    nozzle.position.y=-.55;

    nozzle.castShadow=true;

    printHead.add(nozzle);


    printHead.position.set(
        0,
        3.2,
        0
    );


    printerGroup.add(printHead);


    /* =========================
       PRINTED OBJECT
    ========================= */

    const objectGeometry =
        new THREE.BoxGeometry(
            1.7,
            1.25,
            1.7
        );


    const printedObject =
        new THREE.Mesh(
            objectGeometry,
            orangeMaterial
        );

    printedObject.position.set(
        0,
        -.85,
        0
    );

    printedObject.castShadow=true;

    printerGroup.add(printedObject);


    /* =========================
       TOP DETAILS
    ========================= */

    for(let i=0;i<3;i++){

        const ringGeometry =
            new THREE.TorusGeometry(
                .65-(i*.15),
                .035,
                12,
                40
            );

        const ring =
            new THREE.Mesh(
                ringGeometry,
                silverMaterial
            );

        ring.rotation.x=
            Math.PI/2;

        ring.position.y=
            -.2+(i*.08);

        printerGroup.add(ring);
    }


    /* =========================
       FLOOR
    ========================= */

    const floorGeometry =
        new THREE.CircleGeometry(
            7,
            64
        );

    const floorMaterial =
        new THREE.MeshStandardMaterial({

            color:0xffffff,

            roughness:.5,

            metalness:.1
        });


    const floor =
        new THREE.Mesh(
            floorGeometry,
            floorMaterial
        );

    floor.rotation.x=
        -Math.PI/2;

    floor.position.y=-2.35;

    floor.receiveShadow=true;

    scene.add(floor);


    /* =========================
       DRAG CONTROLS
    ========================= */

    canvas.addEventListener(
        "pointerdown",
        e=>{

            isDragging=true;

            previousX=e.clientX;
            previousY=e.clientY;

            canvas.setPointerCapture(e.pointerId);

        }
    );


    canvas.addEventListener(
        "pointermove",
        e=>{

            if(!isDragging) return;

            const dx =
                e.clientX-previousX;

            const dy =
                e.clientY-previousY;


            targetRotationY +=
                dx*.008;

            targetRotationX +=
                dy*.004;


            targetRotationX =
                Math.max(
                    -.7,
                    Math.min(.7,targetRotationX)
                );


            previousX=e.clientX;
            previousY=e.clientY;

        }
    );


    canvas.addEventListener(
        "pointerup",
        ()=>{
            isDragging=false;
        }
    );


    canvas.addEventListener(
        "pointerleave",
        ()=>{
            isDragging=false;
        }
    );


    /* =========================
       ZOOM
    ========================= */

    canvas.addEventListener(
        "wheel",
        e=>{

            e.preventDefault();

            camera.position.z +=
                e.deltaY*.006;

            camera.position.z =
                Math.max(
                    6,
                    Math.min(
                        14,
                        camera.position.z
                    )
                );

        },
        {passive:false}
    );


    window.addEventListener(
        "resize",
        resize3D
    );


    animate3D();
}


/* ==================================
   RESIZE
================================== */

function resize3D(){

    const canvas =
        document.getElementById("scene");

    if(!canvas || !renderer) return;

    const width =
        canvas.clientWidth;

    const height =
        canvas.clientHeight;


    camera.aspect =
        width/height;

    camera.updateProjectionMatrix();


    renderer.setSize(
        width,
        height
    );
}


/* ==================================
   ANIMATION
================================== */

function animate3D(){

    requestAnimationFrame(
        animate3D
    );

    if(!printerGroup) return;


    printerGroup.rotation.y +=
        (targetRotationY -
        printerGroup.rotation.y)*.08;


    printerGroup.rotation.x +=
        (targetRotationX -
        printerGroup.rotation.x)*.08;


    /* moving print head */

    if(printHead){

        printHead.position.x =
            Math.sin(
                Date.now()*.001
            )*1.7;

    }


    renderer.render(
        scene,
        camera
    );
}


window.addEventListener(
    "load",
    ()=>{
        setTimeout(
            create3DPrinter,
            100
        );
    }
);

</script>

    if(state.page==="product"){
        hash="#product-"+state.id;
    }


    if(state.page==="cart"){
        hash="#cart";
    }


    if(state.page==="checkout"){
        hash="#checkout";
    }


    history.pushState(
        state,
        "",
        hash
    );


    render(state);
}

/* ==================================
   FILTER
================================== */

function filterCategory(
    type,
    category,
    button
){

    document
    .querySelectorAll(".filter-btn")
    .forEach(
        b=>b.classList.remove("active")
    );


    if(button){
        button.classList.add("active");
    }


    const products =
        PRODUCTS.filter(
            p=>
                p.type===type &&
                (
                    category==="all" ||
                    p.category===category
                )
        );


    const grid =
        document.getElementById(
            "productGrid"
        );


    if(grid){

        grid.innerHTML =
            products
            .map(productCard)

/* ==================================

================================== */

function changeMainImage(
    image,
    element
){

    const main =
        document.getElementById(
            "mainProductImage"
        );


    if(main){
        main.src=image;
    }


    document
    .querySelectorAll(".thumb")
    .forEach(
        el=>el.classList.remove("active")
    );


    element.classList.add("active");

/* ==================================
   ADD CART
================================== */

function addToCart(id){

    const product =
        PRODUCTS.find(
            p=>p.id===Number(id)
        );


    if(!product) return;


    const existing =
        cart.find(
            item=>item.id===product.id
        );


    if(existing){

        existing.quantity++;

    }else{

        cart.push({

            id:product.id,

            quantity:1

        });

    }


    saveCart();

    showToast(
        product.name+
        " added to cart"
    );

}


/* ==================================
   ADD FROM DETAIL
================================== */

function addProductFromDetail(id){

    const product =
        PRODUCTS.find(
            p=>p.id===Number(id)
        );


    if(!product) return;


    const input =
        document.getElementById(
            "quantity"
        );


    const quantity =
        Math.max(
            1,
            Number(input?.value)||1
        );


    const existing =
        cart.find(
            item=>item.id===product.id
        );


    if(existing){

        existing.quantity+=quantity;

    }else{

        cart.push({

            id:product.id,

            quantity:quantity

        });

    }


    saveCart();

    showToast(
        quantity+
        " × "+
        product.name+
        " added to cart"
    );

}

/* ==================================
   CHANGE QUANTITY
================================== */

function changeQuantity(
    id,
    change
){

    const item =
        cart.find(
            i=>i.id===Number(id)
        );


    if(!item) return;


    item.quantity+=change;


    if(item.quantity<=0){

        cart =
            cart.filter(
                i=>i.id!==Number(id)
            );

    }


    saveCart();

    render(
        {page:"cart"},
        false
    );

}


/* ==================================
   REMOVE CART
================================== */

function removeFromCart(id){

    cart =
        cart.filter(
            item=>item.id!==Number(id)
        );


    saveCart();

    render(
        {page:"cart"},
        false
    );

}

/* ==================================
   SEARCH
================================== */

function globalSearch(value){

    const q =
        value
        .trim()
        .toLowerCase();


    if(q===""){

        render(
            history.state ||
            {page:"home"},
            false
        );

        return;

    }


    const results =
        PRODUCTS.filter(
            product=>{

                const name =
                    product.name
                    .toLowerCase();


                const description =
                    product.description
                    .toLowerCase();


                const category =
                    product.category
                    .toLowerCase();


                const type =
                    product.type==="printing"
                    ? "3d printing print"
                    : "craft art gifts customized";


                return (

                    name.includes(q) ||

                    description.includes(q) ||

                    category.includes(q) ||

                    type.includes(q)

                );

            }
        );


    renderSearchResults(
        value,
        results
    );

}

   SEARCH RESULTS
================================== */

function renderSearchResults(

){

    const app =
        document.getElementById(

    app.innerHTML=`

    <div class="page-head">

    </h1>

    <p>
    Results for "${query}"
    </p>

    </div>


    ${
        results.length
        ?
        `<div class="products-grid">
        ${results.map(productCard).join("")}
        </div>`
        :
        `<div class="empty">
        <h2>No products found</h2>
        <p>Try another search.</p>
        </div>`
    }

    `;

}


/* ==================================
   IMAGE FALLBACK
================================== */

function imageFallback(
    img,
    name
){

    if(
        img.dataset.fallback==="1"
    ){
        return;
    }


    img.dataset.fallback="1";


    const text =
        encodeURIComponent(
            name
        );


    img.src =
        "https://placehold.co/700x500/f0f0f0/ff6500?text="+
        text;

}


/* ==================================
   RENDER
================================== */

function render(
    state,
    updateHash=true
){

    const app =
        document.getElementById(
            "app"
        );


    if(!state){
        state={page:"home"};
    }


    if(state.page==="home"){

        app.innerHTML=
            renderHome();

        setTimeout(
            create3DPrinter,
            50
        );

    }


    else if(
        state.page==="category"
    ){

        app.innerHTML=
            renderCategory(
                state.type
            );

    }


    else if(
        state.page==="product"
    ){

        app.innerHTML=
            renderProduct(
                state.id
            );

    }


    else if(
        state.page==="cart"
    ){

        app.innerHTML=
            renderCart();

    }


    else if(
        state.page==="checkout"
    ){

        app.innerHTML=
            renderCheckout();

    }


    updateCartCount();

}


/* ==================================
   INITIAL PAGE
================================== */

function initialPage(){

    const hash =
        location.hash;


    if(hash==="#home" || hash===""){

        history.replaceState(
            {page:"home"},
            "",
            "#home"
        );


        render({
            page:"home"
        });


        return;
    }


    if(hash==="#printing"){

        history.replaceState(
            {
                page:"category",
                type:"printing"
            },
            "",
            "#printing"
        );


        render({
            page:"category",
            type:"printing"
        });


        return;
    }


    if(hash==="#craft"){

        history.replaceState(
            {
                page:"category",
                type:"craft"
            },
            "",
            "#craft"
        );


        render({
            page:"category",
            type:"craft"
        });


        return;
    }


    if(hash==="#cart"){

        history.replaceState(
            {page:"cart"},
            "",
            "#cart"
        );


        render({
            page:"cart"
        });


        return;
    }


    if(hash==="#checkout"){

        history.replaceState(
            {page:"checkout"},
            "",
            "#checkout"
        );


        render({
            page:"checkout"
        });


        return;
    }


    const productMatch =
        hash.match(
            /#product-(\d+)/
        );


    if(productMatch){

        const id =
            Number(
                productMatch[1]
            );


        history.replaceState(
            {
                page:"product",
                id:id
            },
            "",
            hash
        );


        render({
            page:"product",
            id:id
        });


        return;
    }


    history.replaceState(
        {page:"home"},
        "",
        "#home"
    );


    render({
        page:"home"
    });

}


initialPage();
