<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>RS 3D Custom Studio</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #ffffff;
    color: #222222;
}

/* ================= HEADER ================= */

.header {
    background: #ffffff;
    text-align: center;
    padding: 35px 20px;
    border-bottom: 3px solid #ff7900;
}

.header h1 {
    font-size: 36px;
    color: #222222;
    margin-bottom: 10px;
}

.header p {
    font-size: 20px;
    color: #666666;
}

/* ================= MAIN ================= */

.container {
    max-width: 850px;
    margin: 30px auto;
    padding: 30px;
    background: #ffffff;
    border: 1px solid #dddddd;
    border-radius: 18px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.08);
}

/* ================= TITLE ================= */

.section-title {
    font-size: 30px;
    color: #ff7900;
    margin-bottom: 25px;
}

/* ================= LABEL ================= */

label {
    display: block;
    font-size: 18px;
    font-weight: bold;
    color: #222222;
    margin-top: 20px;
    margin-bottom: 8px;
}

/* ================= INPUT ================= */

input[type="text"],
input[type="number"],
input[type="file"],
select {
    width: 100%;
    padding: 15px;
    font-size: 17px;
    border: 1px solid #cccccc;
    border-radius: 10px;
    background: #ffffff;
    color: #222222;
}

input[type="file"] {
    cursor: pointer;
}

input:focus,
select:focus {
    outline: none;
    border: 2px solid #ff7900;
}

/* ================= IMAGE PREVIEW ================= */

#imagePreview {
    display: none;
    width: 100%;
    max-height: 350px;
    object-fit: contain;
    margin-top: 15px;
    border: 1px solid #dddddd;
    border-radius: 12px;
    background: #ffffff;
}

/* ================= COLOUR ================= */

.color-title {
    font-size: 30px;
    color: #ff7900;
    margin-top: 30px;
    margin-bottom: 15px;
}

.color-options {
    display: flex;
    gap: 15px;
    flex-wrap: wrap;
    margin-bottom: 18px;
}

.color-option {
    width: 75px;
    height: 75px;
    border-radius: 12px;
    border: 2px solid #cccccc;
    cursor: pointer;
    transition: 0.2s;
}

.color-option:hover {
    transform: scale(1.05);
}

.color-option.selected {
    border: 4px solid #ff7900;
    box-shadow: 0 0 0 2px #ffffff;
}

/* Colours */

.orange {
    background: #ff7900;
}

.black {
    background: #000000;
}

.white {
    background: #ffffff;
}

.grey {
    background: #808080;
}

.silver {
    background: linear-gradient(
        135deg,
        #777777,
        #ffffff,
        #999999,
        #eeeeee
    );
}

/* ================= SELECTED COLOUR ================= */

.selected-color {
    background: #f5f5f5;
    border: 1px solid #dddddd;
    padding: 18px;
    border-radius: 10px;
    font-size: 18px;
    margin-bottom: 25px;
}

#selectedColour {
    font-weight: bold;
}

/* ================= BUTTONS ================= */

.buttons {
    display: flex;
    gap: 12px;
    margin-top: 20px;
}

button {
    flex: 1;
    padding: 16px;
    border: none;
    border-radius: 10px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
}

button:hover {
    opacity: 0.9;
    transform: translateY(-1px);
}

.save-btn {
    background: #ff7900;
    color: #ffffff;
}

.print-btn {
    background: #555555;
    color: #ffffff;
}

.reset-btn {
    background: #222222;
    color: #ffffff;
}

/* ================= MESSAGE ================= */

#message {
    display: none;
    margin-top: 20px;
    padding: 15px;
    background: #f2f2f2;
    border-left: 5px solid #ff7900;
    border-radius: 8px;
    font-size: 16px;
}

/* ================= MOBILE ================= */

@media (max-width: 600px) {

    .header {
        padding: 28px 15px;
    }

    .header h1 {
        font-size: 29px;
    }

    .header p {
        font-size: 17px;
    }

    .container {
        margin: 15px;
        padding: 20px;
        border-radius: 15px;
    }

    .section-title {
        font-size: 27px;
    }

    .color-title {
        font-size: 27px;
    }

    .color-option {
        width: 65px;
        height: 65px;
    }

    .buttons {
        flex-direction: column;
    }

    button {
        width: 100%;
    }
}

</style>
</head>

<body>

<!-- ================= HEADER ================= -->

<header class="header">

    <h1>RS 3D Custom Studio</h1>

    <p>
        Customize your 3D product easily
    </p>

</header>


<!-- ================= MAIN ================= -->

<div class="container">

    <h2 class="section-title">
        Product Details
    </h2>


    <!-- PRODUCT NAME -->

    <label for="productName">
        Product Name
    </label>

    <input
        type="text"
        id="productName"
        placeholder="Enter product name"
    >


    <!-- IMAGE UPLOAD -->

    <label for="productImage">
        Upload 3D/Product Image
    </label>

    <input
        type="file"
        id="productImage"
        accept="image/*"
    >

    <img
        id="imagePreview"
        alt="Product Preview"
    >


    <!-- SIZE -->

    <label for="size">
        Select Size
    </label>

    <select id="size">

        <option value="Small">
            Small
        </option>

        <option value="Medium">
            Medium
        </option>

        <option value="Large">
            Large
        </option>

        <option value="XL">
            XL
        </option>

    </select>


    <!-- QUANTITY -->

    <label for="quantity">
        Quantity
    </label>

    <input
        type="number"
        id="quantity"
        value="1"
        min="1"
    >


    <!-- COLOUR -->

    <h2 class="color-title">
        Select Colour
    </h2>

    <div class="color-options">

        <div
            class="color-option orange selected"
            data-color="Orange"
            onclick="selectColour(this)"
        ></div>

        <div
            class="color-option black"
            data-color="Black"
            onclick="selectColour(this)"
        ></div>

        <div
            class="color-option white"
            data-color="White"
            onclick="selectColour(this)"
        ></div>

        <div
            class="color-option grey"
            data-color="Grey"
            onclick="selectColour(this)"
        ></div>

        <div
            class="color-option silver"
            data-color="Silver"
            onclick="selectColour(this)"
        ></div>

    </div>


    <!-- SELECTED COLOUR -->

    <div class="selected-color">

        Selected Colour:

        <span id="selectedColour">
            Orange
        </span>

    </div>


    <!-- BUTTONS -->

    <div class="buttons">

        <button
            class="save-btn"
            onclick="saveDesign()"
        >
            Save Design
        </button>

        <button
            class="print-btn"
            onclick="printDesign()"
        >
            Print
        </button>

        <button
            class="reset-btn"
            onclick="resetDesign()"
        >
            Reset
        </button>

    </div>


    <!-- MESSAGE -->

    <div id="message"></div>

</div>


<!-- ================= JAVASCRIPT ================= -->

<script>

/* ================= COLOUR ================= */

function selectColour(element) {

    const options =
        document.querySelectorAll(".color-option");

    options.forEach(function(option) {
        option.classList.remove("selected");
    });

    element.classList.add("selected");

    const colour =
        element.getAttribute("data-color");

    document.getElementById("selectedColour")
        .textContent = colour;
}


/* ================= IMAGE PREVIEW ================= */

document.getElementById("productImage")
    .addEventListener("change", function(event) {

        const file = event.target.files[0];

        const preview =
            document.getElementById("imagePreview");

        if (file) {

            const reader =
                new FileReader();

            reader.onload = function(e) {

                preview.src = e.target.result;

                preview.style.display = "block";
            };

            reader.readAsDataURL(file);

        } else {

            preview.style.display = "none";
        }

    });


/* ================= SAVE ================= */

function saveDesign() {

    const name =
        document.getElementById("productName").value;

    const size =
        document.getElementById("size").value;

    const quantity =
        document.getElementById("quantity").value;

    const colour =
        document.getElementById("selectedColour").textContent;

    const message =
        document.getElementById("message");

    if (name.trim() === "") {

        message.textContent =
            "Please enter the product name.";

        message.style.display = "block";

        return;
    }

    message.innerHTML =
        "<strong>Design Saved!</strong><br>" +
        "Product: " + name + "<br>" +
        "Size: " + size + "<br>" +
        "Quantity: " + quantity + "<br>" +
        "Colour: " + colour;

    message.style.display = "block";
}


/* ================= PRINT ================= */

function printDesign() {

    window.print();

}


/* ================= RESET ================= */

function resetDesign() {

    document.getElementById("productName")
        .value = "";

    document.getElementById("size")
        .value = "Small";

    document.getElementById("quantity")
        .value = "1";

    document.getElementById("productImage")
        .value = "";

    document.getElementById("imagePreview")
        .style.display = "none";

    const options =
        document.querySelectorAll(".color-option");

    options.forEach(function(option) {
        option.classList.remove("selected");
    });

    document.querySelector(".orange")
        .classList.add("selected");

    document.getElementById("selectedColour")
        .textContent = "Orange";

    document.getElementById("message")
        .style.display = "none";
}

</script>

</body>
</html>
