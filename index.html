<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>RS 3D Custom Studio</title>

<style>

/* =========================
   BASIC
========================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #ffffff;
    color: #222222;
}


/* =========================
   HEADER
========================= */

.header {
    background: #ffffff;
    text-align: center;
    padding: 30px 15px;
    border-bottom: 3px solid #ff7900;
}

.header h1 {
    font-size: 34px;
    color: #222222;
    margin-bottom: 8px;
}

.header p {
    font-size: 18px;
    color: #666666;
}


/* =========================
   MAIN
========================= */

.container {
    max-width: 900px;
    margin: 25px auto;
    padding: 20px;
}


/* =========================
   SECTION
========================= */

.section {
    background: #ffffff;
    border: 1px solid #dddddd;
    border-radius: 18px;
    padding: 25px;
    margin-bottom: 25px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.07);
}

.section-title {
    color: #ff7900;
    font-size: 29px;
    margin-bottom: 20px;
}


/* =========================
   PRODUCTS
========================= */

.products {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 18px;
}

.product-card {
    background: #ffffff;
    border: 2px solid #dddddd;
    border-radius: 14px;
    padding: 12px;
    cursor: pointer;
    transition: 0.2s;
}

.product-card:hover {
    border-color: #ff7900;
    transform: translateY(-3px);
}

.product-card.selected {
    border: 3px solid #ff7900;
}

.product-card img {
    width: 100%;
    height: 170px;
    object-fit: contain;
    border-radius: 10px;
    background: #f7f7f7;
}

.product-card h3 {
    font-size: 17px;
    margin-top: 10px;
    color: #222222;
}

.product-card p {
    font-size: 14px;
    color: #777777;
    margin-top: 5px;
}


/* =========================
   FORM
========================= */

label {
    display: block;
    font-size: 18px;
    font-weight: bold;
    margin-top: 20px;
    margin-bottom: 8px;
}

input[type="text"],
input[type="number"],
input[type="file"],
select {
    width: 100%;
    padding: 14px;
    font-size: 17px;
    border: 1px solid #cccccc;
    border-radius: 10px;
    background: #ffffff;
    color: #222222;
}

input:focus,
select:focus {
    outline: none;
    border: 2px solid #ff7900;
}


/* =========================
   PRODUCT PREVIEW
========================= */

#productPreview {
    display: none;
    width: 100%;
    max-height: 350px;
    object-fit: contain;
    margin-top: 15px;
    border: 1px solid #dddddd;
    border-radius: 12px;
    background: #f7f7f7;
}


/* =========================
   COLOUR
========================= */

.color-title {
    color: #ff7900;
    font-size: 29px;
    margin-top: 30px;
    margin-bottom: 15px;
}

.color-options {
    display: flex;
    gap: 15px;
    flex-wrap: wrap;
}

.color-option {
    width: 70px;
    height: 70px;
    border-radius: 12px;
    border: 2px solid #cccccc;
    cursor: pointer;
}

.color-option:hover {
    transform: scale(1.05);
}

.color-option.selected {
    border: 4px solid #ff7900;
}

.orange {
    background: #ff7900;
}

.black {
    background: #000000;
}

.white {
    background: #ffffff;
}

.grey {
    background: #808080;
}

.silver {
    background: linear-gradient(
        135deg,
        #777777,
        #ffffff,
        #999999,
        #eeeeee
    );
}


/* =========================
   SELECTED COLOUR
========================= */

.selected-color {
    margin-top: 18px;
    padding: 17px;
    background: #f5f5f5;
    border: 1px solid #dddddd;
    border-radius: 10px;
    font-size: 18px;
}


/* =========================
   BUTTONS
========================= */

.buttons {
    display: flex;
    gap: 12px;
    margin-top: 25px;
}

button {
    flex: 1;
    padding: 15px;
    border: none;
    border-radius: 10px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    opacity: 0.9;
}

.save-btn {
    background: #ff7900;
    color: #ffffff;
}

.print-btn {
    background: #555555;
    color: #ffffff;
}

.reset-btn {
    background: #222222;
    color: #ffffff;
}


/* =========================
   MESSAGE
========================= */

#message {
    display: none;
    margin-top: 20px;
    padding: 15px;
    background: #f5f5f5;
    border-left: 5px solid #ff7900;
    border-radius: 8px;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 700px) {

    .header h1 {
        font-size: 29px;
    }

    .header p {
        font-size: 17px;
    }

    .container {
        margin: 15px;
        padding: 0;
    }

    .section {
        padding: 20px;
    }

    .products {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
    }

    .product-card img {
        height: 130px;
    }

    .product-card h3 {
        font-size: 15px;
    }

    .buttons {
        flex-direction: column;
    }

    button {
        width: 100%;
    }
}

</style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header class="header">

    <h1>RS 3D Custom Studio</h1>

    <p>
        Customize your 3D product easily
    </p>

</header>



<div class="container">


<!-- =========================
     PRODUCTS SECTION
========================= -->

<div class="section">

    <h2 class="section-title">
        Our Products
    </h2>

    <div class="products">


        <!-- PRODUCT 1 -->

        <div
            class="product-card"
            onclick="selectProduct(
                this,
                '3D Personalized Figurine',
                '3DPersonalizedCustomFigurines_3.jpg'
            )"
        >

            <img
                src="3DPersonalizedCustomFigurines_3.jpg"
                alt="3D Personalized Figurine"
            >

            <h3>
                3D Personalized Figurine
            </h3>

            <p>
                Custom 3D Product
            </p>

        </div>


        <!-- PRODUCT 2 -->

        <div
            class="product-card"
            onclick="selectProduct(
                this,
                '3D Printed Miniature',
                '3d-printed-miniatures-sl.jpg'
            )"
        >

            <img
                src="3d-printed-miniatures-sl.jpg"
                alt="3D Printed Miniature"
            >

            <h3>
                3D Printed Miniature
            </h3>

            <p>
                3D Printed Model
            </p>

        </div>


        <!-- PRODUCT 3 -->

        <div
            class="product-card"
            onclick="selectProduct(
                this,
                '3D Model',
                '3d-18.jpg'
            )"
        >

            <img
                src="3d-18.jpg"
                alt="3D Model"
            >

            <h3>
                3D Model
            </h3>

            <p>
                Custom Model
            </p>

        </div>


        <!-- PRODUCT 4 -->

        <div
            class="product-card"
            onclick="selectProduct(
                this,
                'Teddy Bear Keychain',
                'teddy_bear_keychain_01.webp'
            )"
        >

            <img
                src="teddy_bear_keychain_01.webp"
                alt="Teddy Bear Keychain"
            >

            <h3>
                Teddy Bear Keychain
            </h3>

            <p>
                3D Keychain
            </p>

        </div>


        <!-- PRODUCT 5 -->

        <div
            class="product-card"
            onclick="selectProduct(
                this,
                'Toothbrush',
                'toothbrush.png'
            )"
        >

            <img
                src="toothbrush.png"
                alt="Toothbrush"
            >

            <h3>
                Toothbrush
            </h3>

            <p>
                Custom Product
            </p>

        </div>


    </div>

</div>



<!-- =========================
     PRODUCT DETAILS
========================= -->

<div class="section">

    <h2 class="section-title">
        Product Details
    </h2>


    <!-- PRODUCT NAME -->

    <label>
        Product Name
    </label>

    <input
        type="text"
        id="productName"
        placeholder="Select a product above"
    >


    <!-- UPLOAD -->

    <label>
        Upload 3D/Product Image
    </label>

    <input
        type="file"
        id="productImage"
        accept="image/*"
    >

    <img
        id="productPreview"
        alt="Product Preview"
    >


    <!-- SIZE -->

    <label>
        Select Size
    </label>

    <select id="size">

        <option>Small</option>

        <option>Medium</option>

        <option>Large</option>

        <option>XL</option>

    </select>


    <!-- QUANTITY -->

    <label>
        Quantity
    </label>

    <input
        type="number"
        id="quantity"
        value="1"
        min="1"
    >


    <!-- COLOUR -->

    <h2 class="color-title">
        Select Colour
    </h2>


    <div class="color-options">

        <div
            class="color-option orange selected"
            data-color="Orange"
            onclick="selectColour(this)"
        ></div>


        <div
            class="color-option black"
            data-color="Black"
            onclick="selectColour(this)"
        ></div>


        <div
            class="color-option white"
            data-color="White"
            onclick="selectColour(this)"
        ></div>


        <div
            class="color-option grey"
            data-color="Grey"
            onclick="selectColour(this)"
        ></div>


        <div
            class="color-option silver"
            data-color="Silver"
            onclick="selectColour(this)"
        ></div>

    </div>


    <div class="selected-color">

        Selected Colour:

        <strong id="selectedColour">
            Orange
        </strong>

    </div>


    <!-- BUTTONS -->

    <div class="buttons">

        <button
            class="save-btn"
            onclick="saveDesign()"
        >
            Save Design
        </button>


        <button
            class="print-btn"
            onclick="printDesign()"
        >
            Print
        </button>


        <button
            class="reset-btn"
            onclick="resetDesign()"
        >
            Reset
        </button>

    </div>


    <div id="message"></div>

</div>


</div>



<script>

/* =========================
   SELECT PRODUCT
========================= */

function selectProduct(card, name, image) {

    // Remove old selection

    document
        .querySelectorAll(".product-card")
        .forEach(function(item) {

            item.classList.remove("selected");

        });


    // Select current product

    card.classList.add("selected");


    // Put product name

    document.getElementById("productName")
        .value = name;


    // Show product image

    const preview =
        document.getElementById("productPreview");

    preview.src = image;

    preview.style.display = "block";


    // Scroll to details

    document
        .querySelector(".section:nth-child(2)")
        .scrollIntoView({
            behavior: "smooth"
        });

}


/* =========================
   UPLOAD IMAGE
========================= */

document
    .getElementById("productImage")
    .addEventListener("change", function(event) {

        const file =
            event.target.files[0];

        const preview =
            document.getElementById("productPreview");


        if (file) {

            const reader =
                new FileReader();


            reader.onload =
                function(e) {

                    preview.src =
                        e.target.result;

                    preview.style.display =
                        "block";

                };


            reader.readAsDataURL(file);

        }

    });


/* =========================
   COLOUR
========================= */

function selectColour(element) {

    document
        .querySelectorAll(".color-option")
        .forEach(function(option) {

            option.classList.remove("selected");

        });


    element.classList.add("selected");


    const colour =
        element.getAttribute("data-color");


    document
        .getElementById("selectedColour")
        .textContent = colour;

}


/* =========================
   SAVE
========================= */

function saveDesign() {

    const name =
        document.getElementById("productName").value;

    const size =
        document.getElementById("size").value;

    const quantity =
        document.getElementById("quantity").value;

    const colour =
        document.getElementById("selectedColour")
        .textContent;


    const message =
        document.getElementById("message");


    if (name.trim() === "") {

        message.innerHTML =
            "Please select a product.";

        message.style.display =
            "block";

        return;

    }


    message.innerHTML =
        "<strong>Design Saved!</strong><br><br>" +
        "Product: " + name + "<br>" +
        "Size: " + size + "<br>" +
        "Quantity: " + quantity + "<br>" +
        "Colour: " + colour;


    message.style.display =
        "block";

}


/* =========================
   PRINT
========================= */

function printDesign() {

    window.print();

}


/* =========================
   RESET
========================= */

function resetDesign() {

    document
        .getElementById("productName")
        .value = "";


    document
        .getElementById("size")
        .value = "Small";


    document
        .getElementById("quantity")
        .value = "1";


    document
        .getElementById("productImage")
        .value = "";


    const preview =
        document.getElementById("productPreview");

    preview.style.display =
        "none";

    preview.src = "";


    document
        .querySelectorAll(".product-card")
        .forEach(function(card) {

            card.classList.remove("selected");

        });


    document
        .querySelectorAll(".color-option")
        .forEach(function(option) {

            option.classList.remove("selected");

        });


    document
        .querySelector(".orange")
        .classList.add("selected");


    document
        .getElementById("selectedColour")
        .textContent = "Orange";


    document
        .getElementById("message")
        .style.display = "none";

}

</script>

</body>
</html>
