<style>

/* =========================================================
   RS 3D CUSTOM STUDIO
   PREMIUM SINGLE PAGE WEBSITE
   ========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

    background:#070707;
    color:#ffffff;
    overflow-x:hidden;
}

/* =========================
   VARIABLES
========================= */

:root{
    --orange:#ff7a00;
    --orange2:#ffb000;
    --gold:#ff9800;
    --dark:#070707;
    --dark2:#101010;
    --card:#151515;
    --card2:#1b1b1b;
    --gray:#aaaaaa;
    --white:#ffffff;
    --border:rgba(255,140,0,.28);
}

/* =========================
   GLOBAL
========================= */

a{
    text-decoration:none;
    color:inherit;
}

.container{
    width:92%;
    max-width:1200px;
    margin:auto;
}

.section{
    padding:100px 0;
    position:relative;
}

.section-title{
    text-align:center;
    margin-bottom:60px;
}

.section-title .small{
    color:var(--orange);
    font-size:14px;
    font-weight:700;
    letter-spacing:4px;
    text-transform:uppercase;
    margin-bottom:12px;
}

.section-title h2{
    font-size:clamp(32px,5vw,55px);
    font-weight:900;
    text-transform:uppercase;
    letter-spacing:1px;
}

.section-title h2 span{
    color:var(--orange);
}

.section-title p{
    color:#aaa;
    margin-top:15px;
    font-size:17px;
}

/* =========================
   NAVBAR
========================= */

.navbar{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    z-index:9999;

    background:rgba(5,5,5,.88);
    backdrop-filter:blur(18px);

    border-bottom:1px solid rgba(255,140,0,.18);
}

.nav-inner{
    height:75px;

    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
}

.logo-mark{
    font-size:27px;
    font-weight:1000;
    font-style:italic;

    background:linear-gradient(
        135deg,
        #fff,
        #ff7a00
    );

    -webkit-background-clip:text;
    color:transparent;
}

.logo-text{
    font-size:18px;
    font-weight:800;
    letter-spacing:2px;
}

.logo-text span{
    color:var(--orange);
}

.nav-links{
    display:flex;
    gap:28px;
    align-items:center;
}

.nav-links a{
    color:#ccc;
    font-size:14px;
    font-weight:600;
    transition:.3s;
}

.nav-links a:hover{
    color:var(--orange);
}

.nav-btn{
    padding:11px 19px;
    border-radius:30px;

    background:linear-gradient(
        135deg,
        #ff6500,
        #ff9d00
    );

    color:#000 !important;
    font-weight:900 !important;

    box-shadow:
        0 0 20px rgba(255,115,0,.25);
}

.menu{
    display:none;
    font-size:28px;
    cursor:pointer;
}

/* =========================
   HERO
========================= */

.hero{
    min-height:100vh;
    padding-top:75px;

    display:flex;
    align-items:center;

    position:relative;
    overflow:hidden;

    background:
        radial-gradient(
            circle at 50% 35%,
            rgba(255,100,0,.16),
            transparent 35%
        ),
        linear-gradient(
            180deg,
            #0c0c0c,
            #050505
        );
}

/* glowing background */

.hero::before{
    content:"";
    position:absolute;

    width:500px;
    height:500px;

    background:rgba(255,100,0,.10);

    filter:blur(100px);

    top:10%;
    left:-150px;
}

.hero::after{
    content:"";
    position:absolute;

    width:450px;
    height:450px;

    background:rgba(255,160,0,.07);

    filter:blur(100px);

    right:-150px;
    bottom:0;
}

.hero-grid{
    position:absolute;
    inset:0;

    background-image:
        linear-gradient(
            rgba(255,255,255,.025) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255,255,255,.025) 1px,
            transparent 1px
        );

    background-size:50px 50px;

    mask-image:linear-gradient(
        to bottom,
        black,
        transparent
    );
}

.hero-content{
    position:relative;
    z-index:2;

    max-width:900px;
    margin:auto;

    text-align:center;
}

.hero-badge{
    display:inline-flex;
    align-items:center;
    gap:10px;

    padding:10px 18px;

    border:1px solid var(--border);
    border-radius:50px;

    background:rgba(255,100,0,.06);

    color:#ddd;

    font-size:13px;
    font-weight:700;
    letter-spacing:2px;

    margin-bottom:30px;
}

.hero-badge i{
    width:8px;
    height:8px;
    background:var(--orange);
    border-radius:50%;
    box-shadow:0 0 12px var(--orange);
}

.hero h1{
    font-size:clamp(48px,9vw,100px);
    line-height:.95;

    font-weight:1000;
    letter-spacing:-4px;

    text-transform:uppercase;

    margin-bottom:25px;
}

.hero h1 .rs{
    color:#fff;
}

.hero h1 .orange{
    color:var(--orange);
}

.hero h1 .metal{
    background:linear-gradient(
        180deg,
        #fff,
        #888
    );

    -webkit-background-clip:text;
    color:transparent;
}

    color:#aaa;
    font-size:clamp(17px,3vw,23px);
    line-height:1.7;
